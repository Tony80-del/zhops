<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>404 · 页面没找到</title>
<style>
  :root{ --bg:#0f172a; --card:#1e293b; --ink:#e2e8f0; --ink2:#94a3b8; --ok:#5eead4; --accent:#38bdf8; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
        display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
  main{max-width:420px;background:var(--card);border:1px solid #334155;border-radius:16px;padding:32px 28px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  h1{margin:0;font-size:56px;letter-spacing:2px;color:var(--accent)}
  p{margin:12px 0;color:var(--ink2)}
  .hint{font-size:14px}
  code{background:#0f172a;border:1px solid #334155;border-radius:6px;padding:1px 6px;color:var(--ok);font-size:13px}
  .status{color:var(--ok);font-size:14px;min-height:20px}
  nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0 8px}
  nav a{flex:1 1 30%;min-width:96px;text-decoration:none;background:#0f172a;border:1px solid var(--accent);color:var(--accent);
         border-radius:10px;padding:12px 8px;font-size:14px;font-weight:600}
  nav a:active{transform:scale(.97)}
  .small{font-size:12.5px;color:#64748b}
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>这个地址打不开。</p>
  <p class="hint">常见原因：地址<b>末尾多了一个 <code>/</code></b>（例如 <code>admin.html/</code>），或<b>大小写不对</b>（例如 <code>Admin.html</code>）。</p>
  <p class="status" id="st"></p>
  <nav>
    <a href="/zhops/teacher.html">教师端</a>
    <a href="/zhops/admin.html">主端</a>
    <a href="/zhops/">排课系统</a>
  </nav>
  <p class="small">如果上面三个都能打开、只是你敲的那条不行 —— 把地址栏末尾的 <code>/</code> 删掉再回车即可。</p>
</main>
<script>
  (function(){
    var p = location.pathname;
    var st = document.getElementById('st');
    // 已知页面：去掉末尾斜杠 + 纠正大小写 → 自动跳回正确地址
    var m = p.match(/\/(admin|teacher)\.html\/?$/i);
    if (m) {
      var target = '/zhops/' + m[1].toLowerCase() + '.html';
      st.textContent = '正在跳回正确地址：' + target;
      setTimeout(function(){ location.replace(target); }, 600);
      return;
    }
    // 其他 .html 末尾带斜杠：直接去掉斜杠重试（例如 schedule.html/）
    if (/\.html\/?$/i.test(p)) {
      location.replace(p.replace(/\.html\/?$/i, '.html'));
      return;
    }
    st.textContent = '请求的路径：' + p;
  })();
</script>
</body>
</html>

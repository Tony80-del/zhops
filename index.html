<!DOCTYPE html>
<html lang="zh-CN" data-skin="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中文课 · 线上排课系统</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#12151a; --card:#171b21; --line:rgba(255,255,255,.13);
    --text:#e6e9ed; --muted:#9aa2ad; --hint:#6e7681;
    --acc:#4fd1c5; --accb:#0f3f3c; --onacc:#08110f;
    --ok:#6ee7a8; --okb:#0f3d28;
    --warn:#f5c86a; --warnb:#46330d;
    --bad:#f08080; --badb:#46191c;
  }
  [data-skin="light"]{
    --bg:#ffffff; --panel:#f6f6f5; --card:#ffffff; --line:rgba(0,0,0,.12);
    --text:#1a1a1a; --muted:#666666; --hint:#999999;
    --acc:#0C447C; --accb:#E6F1FB; --onacc:#ffffff;
    --ok:#0F6E56; --okb:#E1F5EE; --warn:#854F0B; --warnb:#FAEEDA;
    --bad:#A32D2D; --badb:#FCEBEB;
  }
  [data-skin="paper"]{
    --bg:#faf7f0; --panel:#f1ebdf; --card:#fffdf8; --line:rgba(70,52,24,.16);
    --text:#2e2a22; --muted:#6b6355; --hint:#9c9384;
    --acc:#8a5a1e; --accb:#f4e5cd; --onacc:#fffdf8;
    --ok:#4a6b2a; --okb:#e9f1dc; --warn:#96650f; --warnb:#f8e9c9;
    --bad:#a03528; --badb:#f8e1dd;
  }
  [data-skin="forest"]{
    --bg:#eef4ea; --panel:#e3eddd; --card:#f8fbf5; --line:rgba(34,64,28,.16);
    --text:#1e2a1c; --muted:#55654f; --hint:#8a9a84;
    --acc:#2f6b32; --accb:#dbead6; --onacc:#f8fbf5;
    --ok:#256b3f; --okb:#d6ebdd; --warn:#86620f; --warnb:#f2e6c6;
    --bad:#9c3628; --badb:#f5dfdb;
  }
  [data-skin="night"]{
    --bg:#1a1d24; --panel:#21252e; --card:#262b35; --line:rgba(255,255,255,.14);
    --text:#e8eaee; --muted:#a0a6b2; --hint:#767d8a;
    --acc:#7fb3f0; --accb:#1e3a5c; --onacc:#101620;
    --ok:#5dcfa0; --okb:#12463a; --warn:#f0c26a; --warnb:#4a3410;
    --bad:#f09090; --badb:#4a1f1f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:13px; line-height:1.6;
  }
  header{padding:20px 26px 0; border-bottom:1px solid var(--line); background:var(--panel);}
  h1{font-size:19px; font-weight:500; margin:0 0 4px;}
  .sub{font-size:12px; color:var(--hint); margin:0 0 14px;}
  .hdrow{display:flex; align-items:flex-start; gap:12px;}
  .hdrow .g{flex:1; min-width:0;}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:10px; max-width:1180px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 12px;}
  .stat .lb{font-size:11.5px; color:var(--muted); margin:0 0 2px;}
  .stat .vl{font-size:17px; font-weight:500; margin:0;}
  .tabs{display:flex; gap:6px; margin-top:14px; flex-wrap:wrap;}
  .tab{font-size:12.5px; padding:6px 14px; border:1px solid var(--line); border-bottom:0;
    border-radius:8px 8px 0 0; cursor:pointer; color:var(--muted); background:var(--card); user-select:none;}
  .tab.on{color:var(--acc); border-color:var(--acc); background:var(--bg);}
  .tab .n{font-size:11px; color:var(--hint); margin-left:5px;}
  main{display:grid; grid-template-columns:330px 1fr; gap:0; align-items:start;}
  .col{padding:18px 22px 70px;}
  .col.left{border-right:1px solid var(--line); background:var(--panel); min-height:calc(100vh - 190px);}
  h2{font-size:13.5px; font-weight:500; margin:0 0 10px; display:flex; align-items:center; gap:8px;}
  h2 .cnt{font-size:11px; color:var(--hint); font-weight:400;}
  h3{font-size:12.5px; font-weight:500; margin:20px 0 8px; color:var(--muted);}
  .box{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:12px 13px; margin-bottom:12px;}
  /* 一个总表单里的内部分区（不是独立方框，只做视觉分隔） */
  .sec{padding:13px 0; border-top:1px dashed var(--line);}
  .sec:first-child{padding-top:0; border-top:0;}
  .sec:last-child{padding-bottom:0;}
  .sec-h{font-size:12.5px; font-weight:500; margin:0 0 9px; display:flex; align-items:center; gap:7px;}
  .sec-n{font-size:10.5px; color:var(--acc); background:var(--accb); border-radius:5px; padding:1px 6px; font-weight:400;}
  .row{display:flex; gap:8px; align-items:center;}
  .row + .row{margin-top:8px;}
  /* 参数行的标签：不参与收缩、不换行（否则「单次时长」会被挤成两行） */
  .row > label.m{flex:0 0 auto; white-space:nowrap; color:var(--muted); font-size:12px;}
  .row > span.m{flex:0 0 auto; white-space:nowrap; color:var(--hint); font-size:11.5px;}
  input,select{
    font-family:inherit; font-size:12.5px; color:var(--text); background:var(--card);
    border:1px solid var(--line); border-radius:8px; padding:6px 9px; outline:none; width:100%; min-width:0;
  }
  input:focus,select:focus{border-color:var(--acc);}
  button{
    font-family:inherit; font-size:12.5px; color:var(--text); background:var(--card);
    border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; white-space:nowrap;
  }
  button:hover{border-color:var(--acc); color:var(--acc);}
  button.primary{background:var(--acc); color:var(--onacc); border-color:var(--acc);}
  button.primary:hover{opacity:.9; color:var(--onacc);}
  button.mini{padding:3px 8px; font-size:11.5px;}
  /* 禁用态必须看得出来 —— 否则用户会一直点一个不会响应的按钮 */
  button:disabled{opacity:.42; cursor:not-allowed; filter:saturate(.5);}
  button:disabled:hover{border-color:var(--line); color:var(--text);}
  button.primary:disabled:hover{color:var(--onacc);}
  button.danger:hover{border-color:var(--bad); color:var(--bad);}
  button.ghost{background:transparent; color:var(--muted);}
  .item{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); font-size:12.5px;}
  .item:last-child{border-bottom:0;}
  .item .g{flex:1; min-width:0;}
  .item .m{font-size:11.5px; color:var(--hint);}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{font-size:11.5px; border:1px solid var(--line); border-radius:20px; padding:3px 10px; cursor:pointer; user-select:none;}
  .chip.on{background:var(--accb); color:var(--acc); border-color:var(--acc);}
  .mtx{display:grid; gap:6px; font-size:12px;}
  .mcell{background:var(--card); border:1px solid var(--line); border-radius:9px; padding:9px 8px; min-height:54px;}
  .mcell.head{background:transparent; border:0; font-weight:500; text-align:center; padding:4px; color:var(--muted);}
  .mcell.rowhead{background:transparent; border:0; font-weight:500; padding:4px 0;}
  .mcell.empty{background:var(--panel); border-style:dashed; color:var(--hint); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .mcell.empty:hover{border-color:var(--acc); color:var(--acc);}
  .mcell.full{border-color:var(--acc);}
  .mc-top{display:flex; justify-content:space-between; align-items:center; gap:6px;}
  .mc-id{font-weight:500;}
  .mc-sub{font-size:11px; color:var(--muted); margin-top:3px;}
  .bar{height:4px; border-radius:2px; background:var(--line); margin-top:6px; overflow:hidden;}
  .bar > i{display:block; height:100%; background:var(--acc);}
  .lv{font-size:10.5px; border-radius:4px; padding:1px 6px; background:var(--accb); color:var(--acc);}
  .lv.L2{background:var(--okb); color:var(--ok);}
  .lv.L3{background:var(--warnb); color:var(--warn);}
  .src{font-size:10.5px; border-radius:4px; padding:1px 6px;}
  .src.out{background:var(--warnb); color:var(--warn);}
  .src.own{background:var(--accb); color:var(--acc);}
  .tag{font-size:10.5px; border-radius:4px; padding:1px 6px;}
  .tag.warn{background:var(--warnb); color:var(--warn);}
  .tag.ok{background:var(--okb); color:var(--ok);}
  .tag.bad{background:var(--badb); color:var(--bad);}
  .empty-note{font-size:12px; color:var(--hint); padding:10px 0;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th,td{text-align:left; padding:7px 8px; border-bottom:1px solid var(--line);}
  th{color:var(--muted); font-weight:500; font-size:11.5px;}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums;}
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:var(--acc); color:var(--onacc); border-radius:10px; padding:9px 18px; font-size:12.5px;
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:9;
  }
  .toast.show{opacity:1;}
  .kv{display:grid; grid-template-columns:96px 1fr; gap:4px 10px; font-size:12.5px;}
  .kv .k{color:var(--muted);}
  textarea{font-family:inherit; font-size:12.5px; color:var(--text); background:var(--card);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; outline:none; width:100%; resize:vertical; min-height:70px;}
  textarea:focus{border-color:var(--acc);}
  code{display:block; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 11px;
    word-break:break-all; line-height:1.5; max-height:150px; overflow:auto;}
  .gate{max-width:430px; margin:64px auto; padding:0 22px;}
  .gate h2{font-size:16px; font-weight:500; margin:0 0 6px;}
  .gate p{font-size:12.5px; color:var(--muted); margin:0 0 18px;}
  .gate label{display:block; font-size:12px; color:var(--muted); margin:0 0 5px;}
  .gate .fld{margin-bottom:12px;}
  .cur{display:flex; align-items:center; gap:9px; font-size:12px; color:var(--muted); white-space:nowrap;}
  .cur b{color:var(--text); font-weight:500;}
  .err{color:var(--bad); font-size:12.5px; min-height:19px; margin:8px 0 0;}
  .hint2{font-size:11.5px; color:var(--hint); margin:6px 0 0;}
  /* ---- 通用模态编辑器 ---- */
  .mask{position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:20;
    display:flex; align-items:flex-start; justify-content:center; padding:40px 18px; overflow:auto;}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:13px;
    width:100%; max-width:520px; box-shadow:0 18px 50px rgba(0,0,0,.5);}
  .modal.wide{max-width:760px;}
  .mhd{display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 16px; border-bottom:1px solid var(--line);}
  .mhd b{font-size:13.5px; font-weight:500;}
  .mbd{padding:15px 16px; max-height:min(64vh,560px); overflow:auto;}
  .mft{display:flex; justify-content:flex-end; gap:8px; padding:12px 16px; border-top:1px solid var(--line);}
  .fld{margin-bottom:12px;}
  .fld > label{display:block; font-size:12px; color:var(--muted); margin:0 0 5px;}
  .fld .hint2{margin-top:5px;}
  .g2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .g2 .fld{margin-bottom:12px;}
  @media (max-width:600px){ .g2{grid-template-columns:1fr;} }
  @media (max-width:980px){ main{grid-template-columns:1fr;} .col.left{border-right:0; border-bottom:1px solid var(--line); min-height:0;} }
  @media print{ .col.left,.tabs,button,.toast{display:none!important;} main{grid-template-columns:1fr;} }
</style>
</head>
<body>

<header id="hd">
  <div class="hdrow">
    <div class="g">
      <h1>中文课 · 线上排课系统</h1>
      <p class="sub">时段 × 教师 → 开班 → 编班。1 位教师 + 6~10 位学员，线上视讯授课，课程为 HSK1 共 42 课。</p>
    </div>
    <div class="cur" id="whoBox" style="display:none;">
      <span>当前成员 <b id="whoName"></b></span>
      <button class="mini ghost" onclick="logout()">退出登录</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs"></div>
</header>

<div id="gate" style="display:none;"></div>

<div class="mask" id="mask" style="display:none;">
  <div class="modal" id="modal">
    <div class="mhd"><b id="mTitle"></b><button class="mini ghost" onclick="closeModal()">关闭</button></div>
    <div class="mbd" id="mBody"></div>
    <div class="mft" id="mFoot"></div>
  </div>
</div>

<main id="mainWrap">
  <div class="col left">
    <button class="primary" style="width:100%;padding:9px;" onclick="openClassForm()">+ 开班</button>
    <p class="hint2" style="margin:7px 0 18px;">以教师为主：选教师 → 起班名 → 定人数 → 挑时段。</p>

    <h2>设置 <span class="cnt">一个表单管全部</span></h2>
    <div class="box" id="setupForm">

      <!-- 小节顺序 = 一 教师 / 二 参数 / 三 学员 / 四 时段（2026-09-29 Tony 定） -->
      <div class="sec" id="secTeacher">
        <div class="sec-h"><span class="sec-n">一</span>教师 <span class="cnt" id="tchCnt"></span></div>
        <div id="tchList"></div>
        <div class="row" style="margin-top:8px;"><input id="tName" placeholder="教师姓名" />
          <select id="tSrc" style="width:88px;"><option value="own">自有</option><option value="out">外包</option></select></div>
        <p class="m" style="font-size:11.5px;color:var(--muted);margin:9px 0 6px;">可授课时段</p>
        <div class="chips" id="tSlots"></div>
        <div class="row" style="margin-top:10px;"><button class="primary" style="width:100%;" onclick="addTeacher()">添加教师</button></div>
      </div>

      <div class="sec" id="secParam">
        <div class="sec-h"><span class="sec-n">二</span>参数</div>
        <div class="row"><label class="m" style="width:80px;">开班门槛</label><input id="pMin" type="number" min="1" onchange="setNum('minOpen',this.value)"><span class="m">人</span></div>
        <div class="row"><label class="m" style="width:80px;">班额上限</label><input id="pCap" type="number" min="1" onchange="setNum('capMax',this.value)"><span class="m">人</span></div>
        <div class="row"><label class="m" style="width:80px;">课程课次</label><input id="pLes" type="number" min="1" onchange="setNum('lessonsTotal',this.value)"><span class="m">课</span></div>
        <div class="row" style="align-items:flex-start;"><label class="m" style="width:80px;"></label>
          <div style="flex:1;">
            <div id="pCurri" class="m" style="font-size:11.5px;color:var(--hint);line-height:1.5;">课程体系：读取中…</div>
            <button class="mini" style="margin-top:5px;" onclick="syncCurri()">同步课程体系</button>
          </div></div>
        <div class="row"><label class="m" style="width:80px;">单次时长</label><input id="pMin2" type="number" min="5" onchange="setNum('minutes',this.value)"><span class="m">分钟</span></div>
        <div class="row"><label class="m" style="width:80px;">每周课次</label><input id="pWk" type="number" min="1" onchange="setNum('perWeek',this.value)"><span class="m">次</span></div>
        <div class="row"><label class="m" style="width:80px;">进度同步</label>
          <select id="pSync" onchange="setSync(this.value)">
            <option value="level">同级别全部平行班</option>
            <option value="slot">仅同级别同时段</option>
          </select></div>
        <p class="hint2">同步范围决定插班难度：范围越大，插班越容易。</p>
      </div>

      <div class="sec" id="secStudent">
        <div class="sec-h"><span class="sec-n">三</span>学员 <span class="cnt" id="stuCnt"></span></div>
        <div id="stuList" style="max-height:240px;overflow:auto;"></div>
        <div class="row" style="margin-top:8px;"><input id="stName" placeholder="学员姓名" />
          <select id="stLevel" style="width:74px;"><option>L1</option><option>L2</option><option>L3</option></select></div>
        <div class="row"><select id="stSource"><option value="self">平台招生</option><option value="teacher">教师自带</option></select></div>
        <p class="m" style="font-size:11.5px;color:var(--muted);margin:9px 0 6px;">可上课时段</p>
        <div class="chips" id="stSlots"></div>
        <div class="row" style="margin-top:10px;"><button class="primary" style="width:100%;" onclick="addStudent()">添加学员</button></div>
      </div>

      <div class="sec" id="secSlot">
        <div class="sec-h"><span class="sec-n">四</span>时段 <span class="cnt" id="slotCnt"></span></div>
        <div id="slotList"></div>
        <div class="row" style="margin-top:8px;">
          <input id="sName" placeholder="时段名，如 上午" />
          <input id="sTime" placeholder="09:00–09:45" />
          <button class="mini" onclick="addSlot()">加</button>
        </div>
      </div>
    </div>

    <div class="row" style="margin-top:10px;">
      <button class="mini" onclick="seed()">载入示例</button>
      <button class="mini danger" onclick="reset()">清空重置</button>
    </div>
  </div>

  <div class="col" id="main"></div>
</main>

<div class="toast" id="toast"></div>

<script>
/* ==================== 常量 ==================== */
const KEY = 'zhops.sched.v2';

/* 默认班级名池：越南常见水果（越文为对照，不参与计算） */
const FRUITS = [
  ['苹果班','Táo'],['凤梨班','Dứa'],['芒果班','Xoài'],['火龙果班','Thanh long'],
  ['榴莲班','Sầu riêng'],['山竹班','Măng cầu'],['百香果班','Chanh dây'],['莲雾班','Mận'],
  ['椰子班','Dừa'],['龙眼班','Nhãn'],['红毛丹班','Chôm chôm'],['牛奶果班','Vú sữa'],
  ['柚子班','Bưởi'],['橘子班','Cam'],['西瓜班','Dưa hấu'],['香蕉班','Chuối'],
  ['木瓜班','Đu đủ'],['番石榴班','Ổi']
];

const VIEWS = [
  {id:'board',   name:'排课'},
  {id:'teacher', name:'教师课表'},
  {id:'student', name:'学员课表'},
  {id:'apply',   name:'申请管理'},
  {id:'members', name:'成员'},
  {id:'data',    name:'数据'},
  {id:'settle',  name:'结算', need:'canSettle'}
];

/* ==================== 状态 ==================== */
function blank(){
  return {
    settings:{ minOpen:6, capMax:10, lessonsTotal:42, minutes:45, perWeek:2, sync:'level' },
    members:[],                       /* 可登录的指定成员（由 Tony 自己增删，人数不限）*/
    slots:[
      {id:'s1', code:'S1', name:'早班', time:'07:30–08:15'},
      {id:'s2', code:'S2', name:'午间', time:'12:00–12:45'},
      {id:'s3', code:'S3', name:'晚班', time:'18:30–19:15'},
      {id:'s4', code:'S4', name:'周末', time:'09:00–10:30'}
    ],
    teachers:[], students:[], classes:[], applications:[],
    pickT:[], pickS:[],
    boardLevel:'L1',
    view:'board', selTeacher:'', selStudent:'',
    login:''                          /* 当前登录成员 id —— 会话态，不落盘 */
  };
}
let S = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return blank();
    const o = JSON.parse(raw);
    const b = blank();
    const merged = Object.assign(b, o);
    merged.settings = Object.assign(b.settings, o.settings || {});
    delete merged.settings.pin;       /* 旧版口令机制已废弃，登录取代之 */
    merged.login = '';                /* 登录态不持久化，刷新即需重新登录 */
    merged.pickT = []; merged.pickS = [];
    if(!merged.members) merged.members = [];
    if(!merged.view || merged.view === 'settle') merged.view = 'board';
    return merged;
  }catch(e){ return blank(); }
}
function save(){
  try{
    const o = JSON.parse(JSON.stringify(S));
    delete o.login; delete o.pickT; delete o.pickS;
    localStorage.setItem(KEY, JSON.stringify(o));
  }catch(e){}
}

/* ==================== 工具 ==================== */
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2,7);
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1900);
}
const slot  = id => S.slots.find(x => x.id === id);

/* Firestore REST 的字段是 {类型:值} 包装，递归拆包（与 A 的 fsDec 同款） */
function fsDec(v){
  if(v === null || v === undefined) return null;
  const k = Object.keys(v)[0];
  if(k === 'nullValue') return null;
  if(k === 'stringValue' || k === 'booleanValue') return v[k];
  if(k === 'integerValue' || k === 'doubleValue') return Number(v[k]);
  if(k === 'arrayValue') return (v[k].values || []).map(fsDec);
  if(k === 'mapValue'){ const o = {}; for(const [a,b] of Object.entries(v[k].fields || {})) o[a] = fsDec(b); return o; }
  return v[k];
}
/* 从云上拉最新目录。失败一律静默 —— 断网、file:// 下都必须照常能用。 */
function curriSync(){
  if(!FSCONF || !FSCONF.key || typeof fetch !== 'function') return Promise.resolve(false);
  const url = 'https://firestore.googleapis.com/v1/projects/' + FSCONF.pid +
    '/databases/(default)/documents/meta/curriculum?key=' + encodeURIComponent(FSCONF.key);
  return fetch(url).then(r => {
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(raw => {
    const o = {};
    for(const [a,b] of Object.entries(raw.fields || {})) o[a] = fsDec(b);
    if(!o.levels || !o.levels.length) throw new Error('目录为空');
    CURRI = { schema:o.schema || 1, source:'firestore / meta/curriculum',
              levels:o.levels, stages:o.stages || [], stageLessons:o.stageLessons || {} };
    CURRI_SRC = 'cloud';
    return true;
  }).catch(() => { CURRI = CURRI_FALLBACK; CURRI_SRC = 'fallback'; return false; });
}

const CODE_PREFIX = 'ZHA1.';
function b64dec(s){
  const b64 = s.replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function decodeApp(code){
  const raw = String(code || '').trim().replace(/\s+/g,'');
  if(raw.indexOf(CODE_PREFIX) !== 0) throw new Error('应以 ' + CODE_PREFIX + ' 开头');
  return JSON.parse(b64dec(raw.slice(CODE_PREFIX.length)));
}

function fmtWhen(ts){
  if(!ts) return '';
  const d = new Date(ts), now = new Date();
  const p = n => (n < 10 ? '0' : '') + n;
  const hm = p(d.getHours()) + ':' + p(d.getMinutes());
  const sameDay = d.getFullYear() === now.getFullYear() &&
                  d.getMonth() === now.getMonth() &&
                  d.getDate() === now.getDate();
  return sameDay ? '今天 ' + hm : p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + hm;
}

function importCode(){
  const raw = $('impCode').value.trim();
  if(!raw){ $('impErr').textContent = '请先粘贴申请码'; return; }
  let a;
  try{ a = decodeApp(raw); }
  catch(e){ $('impErr').textContent = '申请码无法解析（' + e.message + '）'; return; }
  if(!a || !a.name){ $('impErr').textContent = '申请码内容不完整，缺少姓名'; return; }

  const levels = (a.levels && a.levels.length) ? a.levels.slice() : [a.level || 'L1'];
  const rawSlots = (a.slots && a.slots.length) ? a.slots.slice() : [];
  const known = rawSlots.filter(id => S.slots.some(s => s.id === id));
  const unknown = rawSlots.filter(id => !S.slots.some(s => s.id === id));
  const slotId = known.length ? known[0] : (S.slots[0] ? S.slots[0].id : '');
  if(!slotId){ $('impErr').textContent = '本机还没有时段，请先在左侧添加时段'; return; }

  /* 申请码里带的是「教师提交时间」；导入时间另记 importedAt。
     教师设备时钟不可信：若时间戳超前于本机，则回落到导入时间。 */
  const now = Date.now();
  const sent = a.at ? Date.parse(a.at) : NaN;
  const at = (!isNaN(sent) && sent <= now) ? sent : now;

  S.applications.push({
    id:'a' + uid(), teacherName:a.name, src:a.src || 'out',
    level:levels[0], levels,
    slotId, slots:known,
    count: a.students || 0,
    contact: a.contact || '', exp: a.exp || '',
    startDate: a.startDate || '', slotNote: a.slotNote || '',
    note: a.note || '', status:'pending', via:'code',
    at, importedAt: now
  });
  $('impErr').textContent = '';
  render();
  toast(unknown.length
    ? ('已导入；' + unknown.length + ' 个时段不在本机时段表，已忽略')
    : '已导入教师端申请');
}

/* ==================== 视图：结算（口令进入） ==================== */
function renderSettle(){
  const rows = S.classes.map(c => {
    const t = tch(c.teacherId);
    const n = c.studentIds.length;
    const rate = t ? (t.rate || 0) : 0;
    const unit = t && t.rateUnit === 'perStudent' ? rate * n : rate;
    return { c, t, n, rate, unit, total: unit * c.lesson };
  });
  const income = rows.filter(r => r.c.src === 'out').reduce((a,r) => a + r.total, 0);
  const cost   = rows.filter(r => r.c.src === 'own').reduce((a,r) => a + r.total, 0);

  let h = '<h2>结算 <span class="cnt">仅「可见结算」的成员能看到</span></h2>' +
    '<div class="stats" style="max-width:none;margin-bottom:14px;">' +
      '<div class="stat"><p class="lb">外包收入</p><p class="vl">' + money(income) + '</p></div>' +
      '<div class="stat"><p class="lb">自有成本</p><p class="vl">' + money(cost) + '</p></div>' +
      '<div class="stat"><p class="lb">净额</p><p class="vl">' + money(income - cost) + '</p></div>' +
    '</div>' +
    '<p class="m" style="font-size:11.5px;color:var(--hint);">单价在「教师」列表里设置：按课次（每上一课结算一次）或按学员×课次（每学员每课次）。</p>';

  /* 单价输入框必须带币种单位，否则「400000」看不出是 VND 还是别的币。
     step=1000 贴合 VND 的实际议价粒度（不会出现 400001 这种数）。 */
  h += '<h2 style="margin-top:20px;">教师单价</h2><div class="box">' +
    (S.teachers.length ? S.teachers.map(t => {

         这是本机 localStorage 里的老数据，不是格式 bug —— 就地提示改。 */
      const legacy = t.rate > 0 && t.rate < 10000;

        '</div>';

    '</div>';

  if(S.teachers.some(t => t.rate > 0 && t.rate < 10000)){
    h += '<p class="hint2" style="color:var(--warn);">有教师的单价还是人民币量级（如 120）。' +
      '这是本机浏览器里的旧数据 —— 直接改成越南盾金额即可（如 400.000 ₫）。</p>';
  }

  h += '<h2 style="margin-top:20px;">按班级</h2>';
  if(!rows.length){
    h += '<div class="empty-note">还没有班级。</div>';
  }else{
    h += '<table><tr><th>班级</th><th>师资</th><th>教师</th><th class="num">人数</th>' +
      '<th class="num">已上课次</th><th class="num">单价</th><th class="num">小计</th></tr>' +
      rows.map(r => '<tr><td>' + esc(r.c.name) + ' <span class="lv ' + r.c.level + '">' + lvName(r.c.level) + '</span></td>' +
        '<td><span class="src ' + r.c.src + '">' + srcCN(r.c.src) + '</span></td>' +
        '<td>' + (r.t ? esc(r.t.name) : '?') + '</td>' +
        '<td class="num">' + r.n + '</td>' +
        '<td class="num">' + r.c.lesson + '</td>' +
        '<td class="num">' + money(r.unit) + '</td>' +
        '<td class="num">' + (r.c.src === 'out' ? '+' : '−') + money(r.total) + '</td></tr>').join('') +
      '</table>';
  }
  h += '<p class="hint2">结算仅对「可见结算」的成员开放；该开关在「成员」页里设置。</p>';
  $('main').innerHTML = h;
}

/* ==================== 操作：参数 ==================== */
function setNum(k, v){
  const n = parseInt(v, 10);
  if(!n || n < 1){ toast('请输入大于 0 的整数'); renderSettings(); return; }
  S.settings[k] = n;
  /* 门槛 ≤ 班额，改哪一边就向另一边对齐（不能反向顶回去） */
  let msg = '已更新';
  if(k === 'minOpen' && S.settings.minOpen > S.settings.capMax){
    S.settings.capMax = S.settings.minOpen;
    msg = '班额上限已跟随门槛调整为 ' + S.settings.capMax + ' 人';
  }else if(k === 'capMax' && S.settings.capMax < S.settings.minOpen){
    S.settings.minOpen = S.settings.capMax;
    msg = '开班门槛已跟随班额调整为 ' + S.settings.minOpen + ' 人';
  }
  /* 连带：班额上限被调低到低于某个班现有人数 —— 不强行踢人，但必须提示 */
  if(k === 'capMax'){
    const over = S.classes.filter(c => c.studentIds.length > S.settings.capMax);
    if(over.length){
      msg = '班额上限已改为 ' + S.settings.capMax + ' 人；' + over.length + ' 个班超过上限（' +
            over.map(c => c.name + ' ' + c.studentIds.length + ' 人').join('、') +
            '），请到「学员」里移出多余的，否则不能再往里编人';
    }
  }
  render(); toast(msg);
}
function setSync(v){ S.settings.sync = v; render(); toast(v === 'level' ? '进度按同级别全部平行班同步' : '进度仅同级别同时段同步'); }

/* ==================== 操作：时段 ==================== */
/* 取最小的未用编号。原来用 slots.length + 1，删掉 S2 后再加会生成重复的 S3。 */
function nextSlotCode(){
  const used = {};
  S.slots.forEach(s => { const m = /^S(\d+)$/.exec(s.code); if(m) used[+m[1]] = 1; });
  let i = 1; while(used[i]) i++;
  return 'S' + i;
}
function addSlot(){
  const n = $('sName').value.trim(), t = $('sTime').value.trim();
  if(!n){ toast('请填写时段名'); return; }
  S.slots.push({ id: uid(), code: nextSlotCode(), name: n, time: t || '待定' });
  $('sName').value = ''; $('sTime').value = '';
  render(); toast('已添加时段 ' + n);
}
function delSlot(id){
  if(S.classes.some(c => c.slotId === id)){ toast('该时段还有班，先删班'); return; }
  const s = slot(id);
  S.slots = S.slots.filter(x => x.id !== id);
  S.teachers.forEach(t => { t.slots = t.slots.filter(x => x !== id); });
  S.students.forEach(x => { x.slots = x.slots.filter(y => y !== id); });
  render(); toast('已删除 ' + (s ? s.name : ''));
}

/* ==================== 操作：教师 / 学员 ==================== */
function pick(which, id){
  const arr = which === 'T' ? S.pickT : S.pickS;
  const i = arr.indexOf(id);
  if(i >= 0) arr.splice(i,1); else arr.push(id);
  if(which === 'T') renderTeachers(); else renderStudents();
}
function addTeacher(){
  const n = $('tName').value.trim();
  if(!n){ toast('请填写教师姓名'); return; }
  if(S.teachers.some(t => t.name === n)){ toast('教师已存在'); return; }
  S.teachers.push({ id: uid(), name: n, src: $('tSrc').value, slots: S.pickT.slice(), rate: 0, rateUnit: 'perLesson' });
  $('tName').value = ''; S.pickT = [];
  render(); toast('已添加教师 ' + n);
}
function delTeacher(id){
  const t = tch(id); if(!t) return;
  if(S.classes.some(c => c.teacherId === id)){ toast('该教师还有班，先删班'); return; }
  S.teachers = S.teachers.filter(x => x.id !== id);
  render(); toast('已删除 ' + t.name);
}
function addStudent(){
  const n = $('stName').value.trim();
  if(!n){ toast('请填写学员姓名'); return; }
  S.students.push({ id: uid(), name: n, level: $('stLevel').value, source: $('stSource').value, slots: S.pickS.slice(), classId: null });
  $('stName').value = ''; S.pickS = [];
  render(); toast('已添加学员 ' + n);
}
function delStudent(id){
  const s = stu(id); if(!s) return;
  if(s.classId){ const c = cls(s.classId); if(c) c.studentIds = c.studentIds.filter(x => x !== id); }
  S.students = S.students.filter(x => x.id !== id);
  render(); toast('已删除 ' + s.name);
}
function setRate(id, v){ const t = tch(id); if(t){ t.rate = Math.max(0, parseFloat(v) || 0); save(); renderSettle(); } }
function setRateUnit(id, v){ const t = tch(id); if(t){ t.rateUnit = v; save(); renderSettle(); } }

/* ==================== 操作：班级 ==================== */
/* 该级别当前的推进进度。同级别同步模式下，新开的班必须从这里起跑，
   否则它永远追不上已有平行班，插班也就无从谈起。 */
function levelProgress(level){
  const same = S.classes.filter(c => c.level === level);
  return same.length ? Math.max.apply(null, same.map(c => c.lesson)) : 1;
}
function createClass(level, teacherId, slotId, name, link, want){
  const t = tch(teacherId);
  if(!t) return { ok:false, msg:'请先选择教师' };
  if(!slot(slotId)) return { ok:false, msg:'请先选择时段' };
  if(S.classes.some(c => c.teacherId === teacherId && c.slotId === slotId))
    return { ok:false, msg:'该教师该时段已有班' };
  if(t.slots && t.slots.length && t.slots.indexOf(slotId) < 0)
    return { ok:false, msg:t.name + ' 未设置该时段可授课' };
  if(name && S.classes.some(c => c.name === name))
    return { ok:false, msg:'班级名「' + name + '」已被占用' };
  const lv = level || 'L1';
  const id = 'c' + uid();
  const c = {
    id, name: name || nextFruit(), level: lv,
    teacherId, slotId, src: t.src, link: link || '',
    studentIds: [],
    lesson: S.settings.sync === 'level' ? levelProgress(lv) : 1,
    openedAt: Date.now()
  };
  S.classes.push(c);
  /* want = 期望编入人数；不传则按班额上限尽量编满 */
  const filled = fillFromPool(c.id, want);
  return { ok:true, id, cls:c, filled, want: (want == null ? null : want) };
}

/* ==================== 开班表单（以教师为主） ==================== */
/* 某位教师实际可授课的时段；他没设置时段 => 视为不限 */
function slotsOfTeacher(t){
  if(!t) return [];
  return (t.slots && t.slots.length) ? t.slots.filter(x => !!slot(x)) : S.slots.map(s => s.id);
}
const teacherBusy = (tid, sid) => S.classes.some(c => c.teacherId === tid && c.slotId === sid);
/* 优先挑「该教师还没排班」的时段 —— 否则默认值一进来就是被占的，白让用户撞一次 */
function firstFreeSlot(t, prefer){
  const usable = slotsOfTeacher(t);
  if(prefer && usable.indexOf(prefer) >= 0 && !teacherBusy(t.id, prefer)) return prefer;
  const free = usable.filter(id => !teacherBusy(t.id, id));
  return free[0] || usable[0] || '';
}
/* 开班时优先挑「还有空闲时段」的教师，别一进来就选中已排满的 */
function pickTeacherForNewClass(teacherId){
  if(teacherId && tch(teacherId)) return tch(teacherId);
  const free = S.teachers.filter(t => slotsOfTeacher(t).some(id => !teacherBusy(t.id, id)));
  return free[0] || S.teachers[0];
}
function openClassForm(teacherId, slotId){
  if(!S.teachers.length){ toast('请先在左侧添加至少一位教师'); return; }
  if(!S.slots.length){ toast('请先在左侧添加至少一个时段'); return; }
  const t0 = pickTeacherForNewClass(teacherId);
  MED = {
    open:true, kind:'classForm', id:'', pick:[],
    refresh:() => drawClassForm(),
    form:{ teacherId:t0.id, name:nextFruit(), count:minOpen(), slotId:'', level:(S.boardLevel || 'L1'), link:'' }
  };
  MED.form.slotId = firstFreeSlot(t0, slotId);
  drawClassForm();
}
/* 把表单里的当前值收回 MED.form（联动重画前必须先收，否则输入会丢） */
function syncClassForm(){
  const f = MED.form; if(!f) return;
  const tid = fv('teacherId'); if(tid) f.teacherId = tid;
  f.name = fv('name'); f.count = fnum('count', 0);
  f.link = fv('link'); f.level = fv('level'); f.slotId = fv('slotId');
}
function drawClassForm(){
  const f = MED.form; if(!f) return;
  const t = tch(f.teacherId) || S.teachers[0];
  f.teacherId = t.id;
  const usable = slotsOfTeacher(t);
  if(usable.indexOf(f.slotId) < 0) f.slotId = firstFreeSlot(t);

  const poolN = S.students.filter(s => !s.classId && s.level === f.level &&
    s.slots.indexOf(f.slotId) >= 0).length;
  const busy = teacherBusy(t.id, f.slotId);
  const willFill = Math.min(f.count, poolN, cap());
  const anyFree = usable.some(id => !teacherBusy(t.id, id));

  $('mTitle').textContent = '开班';
  $('mBody').innerHTML =
    fld({ k:'teacherId', label:'① 教师（为主）', type:'select', value:f.teacherId,
          on:'onClassFormChange(\'teacherId\')',
          opts:S.teachers.map(x => [x.id, x.name + '（' + srcCN(x.src) + '）' +
            (slotsOfTeacher(x).every(id => teacherBusy(x.id, id)) ? ' · 已排满' : '')]),
          hint:'教师是开班的主体 —— 下面第 ④ 项只列他设置过的可授时段。' }) +
    (!anyFree ? '<p class="hint2" style="color:var(--warn);">这位教师的可授时段都已经排满了，' +
                '先改他的可授时段或换一位教师。</p>' : '') +
    fld({ k:'name', label:'② 开班名称', value:f.name, ph:'苹果班 / 凤梨班 …' }) +
    fld({ k:'count', label:'③ 学员人数', type:'number', min:0, value:f.count,
          hint:'按此人数从候选池自动编入（级别与时段都匹配的才编）。' +
               '当前匹配 ' + poolN + ' 人' +
               (willFill < f.count ? '，不足 ' + f.count + ' 人，只能编入 ' + willFill + ' 人' : '') + '。' }) +
    fld({ k:'slotId', label:'④ 时段', type:'select', value:f.slotId,
          on:'onClassFormChange(\'slotId\')',
          opts: usable.length ? usable.map(id => [id, slotLabel(id) + (teacherBusy(t.id, id) ? ' · 已被占用' : '')])
                              : [['', '（该教师没有可授时段）']],
          hint: busy ? '⚠ 该教师这个时段已经有班，开班会被拒。' : '' }) +
    '<div class="g2">' +
      fld({ k:'level', label:'级别', type:'select', value:f.level,
            on:'onClassFormChange(\'level\')',
            opts:[['L1','HSK1'],['L2','HSK2'],['L3','HSK3']],
            hint:'同级别平行班进度会对齐到第 ' + levelProgress(f.level) + ' 课。' }) +
      fld({ k:'link', label:'视讯链接（选填）', value:f.link, ph:'腾讯会议 / Zoom' }) +
    '</div>';

  $('mFoot').innerHTML = mCancel +
    '<button class="mini primary" onclick="saveClassForm()"' + (busy ? ' disabled' : '') + '>开班</button>';
  /* 开班表单是自己画 body/foot 的（不走 openModal），所以这里要显式把遮罩打开 */
  $('modal').className = 'modal';
  $('mask').style.display = 'flex';
}
function onClassFormChange(which){
  syncClassForm();
  if(which === 'teacherId'){
    const t = tch(MED.form.teacherId);
    MED.form.slotId = firstFreeSlot(t);
  }
  drawClassForm();
}
function saveClassForm(){
  syncClassForm();
  const f = MED.form;
  const name = f.name;
  if(!name){ toast('请填写开班名称'); return; }
  const want = Math.max(0, f.count);
  if(want > cap()){ toast('班额上限是 ' + cap() + ' 人，请先把人数改小或调高上限'); return; }
  const r = createClass(f.level, f.teacherId, f.slotId, name, f.link, want);
  if(!r.ok){ toast(r.msg); return; }
  closeModal(); render();
  toast('已开班 ' + r.cls.name + '（' + r.filled + '/' + want + ' 人）' +
        (r.filled < want ? '，候选池只找到 ' + r.filled + ' 个匹配学员' : ''));
}
/* 点矩阵空格：不再直接建班，改为把教师 + 时段带进开班表单 */
function quickOpen(teacherId, slotId){
  openClassForm(teacherId, slotId);
}
function delClass(id){
  const c = cls(id); if(!c) return;
  if(c.studentIds.length && !confirm(c.name + ' 有 ' + c.studentIds.length + ' 名学员，确认删除？学员将退回候选池。')) return;
  c.studentIds.forEach(sid => { const s = stu(sid); if(s) s.classId = null; });
  S.classes = S.classes.filter(x => x.id !== id);
  render(); toast('已删除 ' + c.name + '，学员退回候选池');
}
function advance(id){
  const c = cls(id); if(!c) return;
  const T = totalLessons();
  if(c.lesson >= T){ toast(c.name + ' 已完成全部 ' + T + ' 课次'); return; }
  const scope = S.settings.sync === 'level'
    ? S.classes.filter(x => x.level === c.level)
    : S.classes.filter(x => x.level === c.level && x.slotId === c.slotId);
  scope.forEach(x => { if(x.lesson < T) x.lesson++; });
  render(); toast('已推进：' + scope.map(x => x.name).join('、'));
}
/* 视讯链接已并入「改班级」表单，这里不再单独开 prompt 入口 */

/* ==================== 操作：编班 ==================== */
function findClassFor(s){
  return S.classes.find(c => c.level === s.level
    && c.studentIds.length < cap()
    && s.slots.indexOf(c.slotId) >= 0);
}
/* limit = 最多编入几人；不传表示按班额上限尽量编满 */
function fillFromPool(cid, limit){
  const c = cls(cid); if(!c) return 0;
  const max = (limit == null) ? cap() : Math.min(limit, cap());
  let n = 0;
  S.students.filter(s => !s.classId).forEach(s => {
    if(c.studentIds.length >= max) return;
    if(s.level !== c.level) return;
    if(s.slots.indexOf(c.slotId) < 0) return;
    c.studentIds.push(s.id); s.classId = c.id; n++;
  });
  return n;
}
function autoAssign(){
  let n = 0;
  S.students.filter(s => !s.classId).forEach(s => {
    const c = findClassFor(s);
    if(c){ c.studentIds.push(s.id); s.classId = c.id; n++; }
  });
  render();
  toast(n ? ('已编入 ' + n + ' 人') : '没有可匹配的班级（检查级别与时段）');
}

/* ==================== 操作：开班申请 ==================== */
function submitApply(){
  const name = $('aName').value.trim();
  if(!name){ toast('请填写教师姓名'); return; }
  const slotId = $('aSlot').value;
  if(!slotId){ toast('请先添加时段'); return; }
  S.applications.push({
    id: 'a' + uid(), teacherName: name, src: $('aSrc').value,
    level: $('aLevel').value, slotId,
    count: parseInt($('aCount').value, 10) || 0,
    note: $('aNote').value.trim(), status: 'pending', via: 'manual', at: Date.now()
  });
  render(); toast('申请已提交，等待审核');
}
function approve(id){
  const a = S.applications.find(x => x.id === id); if(!a) return;

  /* 教师在申请里可能勾了多个时段 —— 必须全部登记为该教师的可授时段。
     只登记 slotId（第一个时段）的话，createClass() 的
     「教师未设置该时段可授课」校验会把其余时段全部挡死。 */
  const want = (a.slots && a.slots.length ? a.slots.slice() : [])
    .filter(x => x && S.slots.some(s => s.id === x));
  if(a.slotId && want.indexOf(a.slotId) < 0) want.unshift(a.slotId);
  if(!want.length && a.slotId) want.push(a.slotId);

  let t = S.teachers.find(x => x.name === a.teacherName);
  if(!t){
    t = { id: uid(), name: a.teacherName, src: a.src, slots: want.slice(), rate: 0, rateUnit: 'perLesson' };
    S.teachers.push(t);
  }else{
    if(!t.slots) t.slots = [];
    want.forEach(x => { if(t.slots.indexOf(x) < 0) t.slots.push(x); });
  }
  const r = createClass(a.level, t.id, a.slotId);
  if(!r.ok){ toast('无法建班：' + r.msg); return; }
  a.status = 'approved';
  render(); toast('已通过并开班 ' + r.cls.name);
}
function reject(id){
  const a = S.applications.find(x => x.id === id); if(!a) return;
  a.status = 'rejected';
  render(); toast('已拒绝');
}

function addMember(){

  const user = $('mUser').value.trim();

function delMember(id){

  if(!confirm('确认删除成员「' + (m.name || m.user) + '」？')) return;
  S.members = S.members.filter(x => x.id !== id);
  render(); toast('已删除 ' + (m.name || m.user));
}
function toggleSettle(id){
  const m = S.members.filter(x => x.id === id)[0]; if(!m) return;

function saveTeacher(){
  const t = tch(MED.id); if(!t) return closeModal();
  const name = fv('name');
  if(!name){ toast('请填写教师姓名'); return; }
  if(S.teachers.some(x => x.id !== t.id && x.name === name)){ toast('已有同名教师'); return; }
  const oldSrc = t.src;
  t.name = name;
  t.src = fv('src');
  t.rate = Math.max(0, parseFloat(fv('rate')) || 0);
  t.rateUnit = fv('rateUnit');
  t.slots = MED.pick.slice();
  /* 连带：班级的师资类型是开班时从教师复制的，改教师身份要同步过去 */
  if(oldSrc !== t.src) S.classes.filter(c => c.teacherId === t.id).forEach(c => { c.src = t.src; });
  /* 连带：收窄可授时段后，已排在这些时段之外的班要提醒 */
  const off = t.slots.length
    ? S.classes.filter(c => c.teacherId === t.id && t.slots.indexOf(c.slotId) < 0)
    : [];
  closeModal(); render();
  toast('已保存 ' + name + (off.length
    ? '；注意 ' + off.length + ' 个班在已取消的时段里（' + off.map(c => c.name).join('、') + '）'
    : ''));
}

  openModal({

        fld({ k:'level', label:'级别', type:'select', value:s.level,
              opts:[['L1','HSK1'],['L2','HSK2'],['L3','HSK3']] }) +

              opts:[['self','平台招生'],['teacher','教师自带']] }) +
      '</div>' +
      mChips('可上课时段', s.slots || [], '改了级别或时段后，上面的班级下拉会重新匹配。') +
      fld({ k:'classId', label:'编入班级', type:'select', value:(cur ? cur.id : ''),
            opts, hint:'换班直接在这里改；选「不编班」即退回候选池。' }),
    foot: mCancel + '<button class="mini primary" onclick="saveStudent()">保存</button>'
  });
}
function saveStudent(){
  const s = stu(MED.id); if(!s) return closeModal();
  const name = fv('name');
  if(!name){ toast('请填写学员姓名'); return; }
  const lv = fv('level'), target = fv('classId');
  const oldClass = s.classId;
  s.name = name; s.source = fv('source'); s.slots = MED.pick.slice(); s.level = lv;

  /* 先从原班摘掉 */
  const oc = oldClass ? cls(oldClass) : null;
  if(oc) oc.studentIds = oc.studentIds.filter(x => x !== s.id);
  s.classId = null;

  let msg = '已保存 ' + name;
  if(target){
    const tc = cls(target);
    if(!tc){ msg += '；目标班不存在，已留在候选池'; }
    else if(tc.studentIds.length >= cap()){ msg += '；「' + tc.name + '」已满 ' + cap() + ' 人，已留在候选池'; }
    else if(tc.level !== lv || s.slots.indexOf(tc.slotId) < 0){
      msg += '；与「' + tc.name + '」的级别或时段不符，已留在候选池';
    }else{
      tc.studentIds.push(s.id); s.classId = tc.id;
      msg += (oc && oc.id !== tc.id) ? '；已从「' + oc.name + '」换到「' + tc.name + '」' : '；已编入「' + tc.name + '」';
    }
  }else if(oc){
    msg += '；已从「' + oc.name + '」退回候选池';
  }
  closeModal(); render(); toast(msg);
}

/* ==================== 编辑：班级 ==================== */

  const tOpts = S.teachers.map(t => [t.id, t.name + '（' + srcCN(t.src) + '）']);

  /* 时段只列「该教师可授」的；加上当前时段以防它已不在可授范围内 */
  const usable = slotsOfTeacher(tch(c.teacherId));

    .map(sid => [sid, slotLabel(sid)]);
  openModal({
    kind:'class', id, title:'编辑班级',
    body:
      fld({ k:'name', label:'开班名称', value:c.name }) +
      '<div class="g2">' +
        fld({ k:'teacherId', label:'教师', type:'select', value:c.teacherId, opts:tOpts }) +
        fld({ k:'slotId', label:'时段', type:'select', value:c.slotId,
              opts:sOpts.length ? sOpts : [['', '（没有可用时段）']] }) +
      '</div>' +
      '<div class="g2">' +
        fld({ k:'level', label:'级别', type:'select', value:c.level,
              opts:[['L1','HSK1'],['L2','HSK2'],['L3','HSK3']],
              hint:'改级别后进度会重新对齐到该级别的当前进度。' }) +
        fld({ k:'lesson', label:'当前进度（第几课）', type:'number', min:1, value:c.lesson }) +
      '</div>' +
      fld({ k:'link', label:'视讯链接', value:(c.link || ''), ph:'腾讯会议 / Zoom / Google Meet' }) +
      '<p class="hint2">在班学员 ' + c.studentIds.length + '/' + cap() + ' 人。' +
        '改教师或时段后，与班级不再匹配的学员会自动退回候选池。</p>',
    foot: mCancel + '<button class="mini primary" onclick="saveClass()">保存</button>'
  });
}
function saveClass(){
  const c = cls(MED.id); if(!c) return closeModal();
  const name = fv('name');
  if(!name){ toast('请填写开班名称'); return; }
  if(S.classes.some(x => x.id !== c.id && x.name === name)){ toast('班级名「' + name + '」已被占用'); return; }
  const tid = fv('teacherId'), sid = fv('slotId'), lv = fv('level');
  const t = tch(tid);
  if(!t){ toast('请选择教师'); return; }
  if(!slot(sid)){ toast('请选择时段'); return; }
  if(S.classes.some(x => x.id !== c.id && x.teacherId === tid && x.slotId === sid)){
    toast('该教师这个时段已经有班了'); return;
  }
  const oldLv = c.level, oldSlot = c.slotId;

  c.name = name; c.teacherId = tid; c.slotId = sid; c.src = t.src;
  c.level = lv;
  c.link = fv('link');
  c.lesson = Math.min(Math.max(1, fnum('lesson', c.lesson)), totalLessons());

  /* 连带 1：换级别 → 同级别同步模式下要对齐到新级别的进度 */
  if(oldLv !== lv && S.settings.sync === 'level'){
    const p = levelProgress(lv);
    if(p > 1){ c.lesson = p; }
  }
  /* 连带 2：级别或时段变了 → 班内不再匹配的学员退回候选池 */
  const drop = c.studentIds.filter(sid2 => {
    const s = stu(sid2);
    return !s || s.level !== c.level || s.slots.indexOf(c.slotId) < 0;
  });
  if(drop.length){
    c.studentIds = c.studentIds.filter(x => drop.indexOf(x) < 0);
    drop.forEach(x => { const s = stu(x); if(s) s.classId = null; });
  }
  closeModal(); render();
  toast('已保存 ' + name + (drop.length ? '；' + drop.length + ' 名学员与新设置不符，已退回候选池' : ''));
}

function manageClass(id){

function drawManageClass(id){
  const c = cls(id); if(!c) return;
  const inside = c.studentIds.map(stu).filter(Boolean);
  const pool = S.students.filter(s => !s.classId && s.level === c.level && s.slots.indexOf(c.slotId) >= 0);
  const other = S.students.filter(s => !s.classId && (s.level !== c.level || s.slots.indexOf(c.slotId) < 0));
  const full = inside.length >= cap();

  $('mTitle').textContent = '班级学员 · ' + c.name;
  $('mBody').innerHTML =
    '<div class="fld"><label>在班 ' + inside.length + '/' + cap() + ' 人' +
      (full ? '（已满）' : '') + '</label>' +
      (inside.length ? inside.map(s =>
        '<div class="item"><span class="g">' + esc(s.name) +
        ' <span class="lv ' + s.level + '">' + lvName(s.level) + '</span>' +
        '<div class="m">' + (s.source === 'teacher' ? '教师自带' : '平台招生') +
        ' · 可选 ' + (s.slots.length ? s.slots.map(slotLabel).join('、') : '未设置') + '</div></span>' +
        '<button class="mini danger" onclick="kickStudent(\'' + id + '\',\'' + s.id + '\')">移出</button></div>').join('')
        : '<div class="empty-note">班内还没有学员</div>') +
    '</div>' +
    '<div class="fld"><label>候选池里级别与时段都匹配的（' + pool.length + ' 人）</label>' +
      (pool.length ? pool.map(s =>
        '<div class="item"><span class="g">' + esc(s.name) +
        ' <span class="lv ' + s.level + '">' + lvName(s.level) + '</span>' +
        '<div class="m">可选 ' + s.slots.map(slotLabel).join('、') + '</div></span>' +
        '<button class="mini" onclick="putStudent(\'' + id + '\',\'' + s.id + '\')"' + (full ? ' disabled' : '') + '>加入</button></div>').join('')
        : '<div class="empty-note">没有匹配的待编学员</div>') +
    '</div>' +
    (other.length ? '<p class="hint2">另有 ' + other.length + ' 名待编学员的级别或时段与本届不符，未列出。</p>' : '') +
    '<div class="row" style="margin-top:4px;">' +
      '<button class="mini primary" onclick="fillClass(\'' + id + '\')">把匹配的学员全部编入</button></div>';
  $('mFoot').innerHTML = '<button class="mini" onclick="closeModal()">关闭</button>';
}
function putStudent(cid, sid){
  const c = cls(cid), s = stu(sid); if(!c || !s) return;
  if(c.studentIds.length >= cap()){ toast('该班已满（上限 ' + cap() + ' 人）'); return; }
  if(c.studentIds.indexOf(sid) < 0) c.studentIds.push(sid);
  s.classId = c.id;
  render(); toast(s.name + ' 已编入 ' + c.name);
}
function kickStudent(cid, sid){
  const c = cls(cid), s = stu(sid); if(!c || !s) return;
  c.studentIds = c.studentIds.filter(x => x !== sid);
  if(s.classId === cid) s.classId = null;
  render(); toast(s.name + ' 已退回候选池');
}
function fillClass(cid){
  const c = cls(cid); if(!c) return;
  const n = fillFromPool(cid);
  render(); toast(n ? ('已编入 ' + n + ' 人') : '没有可编入的学员（检查级别与时段）');
}

      fld({ k:'teacherName', label:'教师姓名', value:a.teacherName }) +
      '<div class="g2">' +
        fld({ k:'src', label:'身份', type:'select', value:a.src,
              opts:[['out','外包'],['own','自有']] }) +
        fld({ k:'count', label:'学生人数', type:'number', min:0, value:(a.count || 0) }) +
      '</div>' +
      fld({ k:'level', label:'级别', type:'select', value:(a.level || 'L1'),
            opts:[['L1','HSK1'],['L2','HSK2'],['L3','HSK3']] }) +
      mChips('可上课时段', a.slots || (a.slotId ? [a.slotId] : [])) +
      fld({ k:'startDate', label:'期望开课日期', type:'date', value:(a.startDate || '') }) +
      fld({ k:'note', label:'备注', type:'textarea', value:(a.note || '') }),
    foot: mCancel + '<button class="mini primary" onclick="saveApply()">保存</button>'
  });
}
function saveApply(){
  const a = S.applications.filter(x => x.id === MED.id)[0]; if(!a) return closeModal();
  const name = fv('teacherName');
  if(!name){ toast('请填写教师姓名'); return; }
  const known = MED.pick.filter(x => !!slot(x));
  a.teacherName = name;
  a.src = fv('src');
  a.count = Math.max(0, fnum('count', 0));
  a.level = fv('level');
  a.levels = [a.level];
  a.slots = known;
  a.slotId = known.length ? known[0] : (S.slots[0] ? S.slots[0].id : '');
  a.startDate = fv('startDate');
  a.note = fv('note');
  closeModal(); render(); toast('已保存申请（' + name + '）');
}
function delApply(id){
  const a = S.applications.filter(x => x.id === id)[0]; if(!a) return;
  if(!confirm('确认删除「' + a.teacherName + '」的这条申请？')) return;
  S.applications = S.applications.filter(x => x.id !== id);
  render(); toast('已删除该申请');
}
function reopenApply(id){
  const a = S.applications.filter(x => x.id === id)[0]; if(!a) return;
  a.status = 'pending';
  render(); toast('已撤销处理，回到待审核');
}

/* ==================== 视图：数据（备份 / 迁移 / 重置） ==================== */
function backupPayload(){
  const o = JSON.parse(JSON.stringify(S));
  delete o.login; delete o.pickT; delete o.pickS;
  o.__app = 'zhops.sched'; o.__v = 2; o.__at = new Date().toISOString();
  return o;
}
function renderData(){
  const n = S.classes.reduce((a,c) => a + c.studentIds.length, 0);
  const raw = localStorage.getItem(KEY) || '';
  const rows = [
    ['时段', S.slots.length + ' 个'],
    ['教师', S.teachers.length + ' 位（自有 ' + S.teachers.filter(t => t.src === 'own').length +
            ' · 外包 ' + S.teachers.filter(t => t.src === 'out').length + '）'],
    ['学员', S.students.length + ' 人（已编班 ' + n + ' · 候选池 ' + (S.students.length - n) + '）'],
    ['班级', S.classes.length + ' 个'],
    ['申请', S.applications.length + ' 条（待审 ' + S.applications.filter(a => a.status === 'pending').length + '）'],
    ['成员', S.members.length + ' 位（可见结算 ' + S.members.filter(m => m.canSettle).length + '）'],
    ['占用体积', (raw.length / 1024).toFixed(1) + ' KB']
  ];
  $('main').innerHTML =
    '<h2>数据 <span class="cnt">备份 / 迁移 / 重置</span></h2>' +
    '<div class="box">' +
      '<p class="hint2" style="margin:0 0 11px;">现在这份数据只存在这台电脑的浏览器里。' +
      '<b>上云之前，先把备份下载下来</b> —— 换电脑、清缓存、或改坏了都能恢复。</p>' +
      '<div class="kv">' + rows.map(r =>
        '<div class="k">' + r[0] + '</div><div>' + r[1] + '</div>').join('') + '</div>' +
      '<div class="row" style="margin-top:13px;flex-wrap:wrap;">' +
        '<button class="mini primary" onclick="exportData()">导出备份（下载 JSON）</button>' +
        '<button class="mini" onclick="copyData()">复制到剪贴板</button>' +
        '<button class="mini" onclick="showImport()">从备份导入</button>' +
      '</div>' +
    '</div>' +
    '<div class="box" style="border-color:var(--warn);">' +
      '<b style="color:var(--warn);">危险区</b>' +
      '<p class="hint2">下面两个按钮会清空业务数据（成员账号会保留）。清空之前请先导出备份。</p>' +
      '<div class="row" style="margin-top:10px;flex-wrap:wrap;">' +
        '<button class="mini" onclick="seed()">载入示例数据</button>' +
        '<button class="mini danger" onclick="reset()">清空全部业务数据</button>' +
      '</div>' +
    '</div>';
}
function exportData(){
  const txt = JSON.stringify(backupPayload(), null, 2);
  const name = '排课备份_' + new Date().toISOString().slice(0,10) + '.json';
  try{
    const blob = new Blob([txt], { type:'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('已导出 ' + name);
  }catch(e){
    /* jsdom / 旧浏览器兜底：直接把内容放进可复制的框 */
    openModal({ title:'导出备份', wide:true,
      body:'<p class="hint2">这个环境不支持直接下载，请手动全选复制下面的内容保存为 .json。</p><code>' +
           esc(txt) + '</code>',
      foot:'<button class="mini" onclick="closeModal()">关闭</button>' });
  }
}
function copyData(){
  const txt = JSON.stringify(backupPayload(), null, 2);
  const done = () => toast('备份内容已复制（' + (txt.length / 1024).toFixed(1) + ' KB）');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  }else{
    fallbackCopy(txt, done);
  }
}
function fallbackCopy(txt, done){
  try{
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); done();
  }catch(e){ toast('复制失败，请改用「导出备份」'); }
}
function showImport(){
  openModal({
    kind:'import', title:'从备份导入', wide:true,
    body:
      '<p class="hint2" style="margin:0 0 10px;">把之前导出的 JSON 内容整段粘进来。' +
      '导入会<b>覆盖</b>当前的时段、教师、学员、班级与申请。</p>' +
      '<div class="fld"><label>备份内容</label>' +
        '<textarea id="f_txt" placeholder="粘贴 JSON …" style="min-height:150px;"></textarea></div>' +
      '<label class="cur"><input type="checkbox" id="f_withMembers" style="width:auto;" /> ' +
        '连成员账号一起导入（会覆盖本机成员）</label>' +
      '<p class="hint2">不勾选时保留本机的成员名单与口令。</p>',
    foot: mCancel + '<button class="mini primary" onclick="doImport()">确认导入</button>'
  });
}
function doImport(){
  let o;
  try{ o = JSON.parse(fr('txt')); }
  catch(e){ toast('不是合法的 JSON：' + e.message); return; }
  if(!o || typeof o !== 'object' || Array.isArray(o)){ toast('备份内容格式不对'); return; }
  if(!Array.isArray(o.slots) || !Array.isArray(o.teachers) || !Array.isArray(o.classes)){
    toast('备份缺少必要字段（slots / teachers / classes）'); return;
  }
  const withMembers = fchk('withMembers');
  if(!confirm('导入会覆盖当前的业务数据' + (withMembers ? '（含成员账号）' : '（成员账号保留）') + '。确认继续？')) return;

  const keepMembers = S.members, keepLogin = S.login;
  const b = blank();
  S = Object.assign(b, o);
  S.settings = Object.assign(b.settings, o.settings || {});
  delete S.settings.pin;
  S.members = withMembers && Array.isArray(o.members) && o.members.length ? o.members : keepMembers;
  S.login = (S.members.some(m => m.id === keepLogin)) ? keepLogin : '';
  S.pickT = []; S.pickS = [];
  delete S.__app; delete S.__v; delete S.__at;
  if(!S.view || S.view === 'settle' || S.view === 'data') S.view = 'board';
  /* 修复悬空引用：班级里的学员 id 必须真实存在 */
  S.classes.forEach(c => {
    if(!Array.isArray(c.studentIds)) c.studentIds = [];
    c.studentIds = c.studentIds.filter(id => S.students.some(s => s.id === id));
  });
  S.students.forEach(s => { if(s.classId && !S.classes.some(c => c.id === s.classId)) s.classId = null; });

  closeModal(); render(); toast('已从备份恢复');
}

/* ==================== 示例 / 重置 ==================== */
function seed(){
  if(S.classes.length || S.teachers.length || S.students.length){
    if(!confirm('载入示例会覆盖当前的时段、教师、学员、班级与申请（成员账号保留）。确认继续？')) return;
  }
  closeModal();
  const keepMembers = S.members, keepLogin = S.login;
  S = blank();
  S.members = keepMembers; S.login = keepLogin;   /* 载入示例不清掉登录状态 */
  /* 示例单价按 VND 口径（2026-09-30 随币种改）：自有按课次、外包按学员×课次。
     这是演示数据，真实单价在「结算」页或教师「改」里改。 */
  S.teachers = [
    { id:'t1', name:'王老师', src:'own', slots:['s1','s3'], rate:400000, rateUnit:'perLesson' },
    { id:'t2', name:'李老师', src:'own', slots:['s4','s1'], rate:400000, rateUnit:'perLesson' },
    { id:'t3', name:'Nguyễn 老师', src:'out', slots:['s2','s3'], rate:250000, rateUnit:'perStudent' }
  ];
  const mk = (name, level, slots, source) => ({ id:'u' + uid(), name, level, source, slots, classId:null });
  const A6 = ['阮文A','阮文B','陈氏C','黎文D','黄氏E','武文F'];   /* 时段 s1 / s3 */
  const B6 = ['范氏G','吴文H','丁文I','段氏J','苏文K','阮氏L'];   /* 时段 s4 */
  const C6 = ['黄文M','陈文N','黎氏O','武氏P','范文Q','邓氏R'];   /* 时段 s2（外包班）*/
  S.students = []
    .concat(A6.map(n => mk(n, 'L1', ['s1','s3'], 'self')))
    .concat(B6.map(n => mk(n, 'L1', ['s4'], 'teacher')))
    .concat(C6.map(n => mk(n, 'L1', ['s2'], 'self')))
    .concat([mk('李文S','L2',['s1'],'self'), mk('阮文T','L2',['s1'],'self')])
    .concat([mk('候补甲','L3',['s2'],'self'), mk('候补乙','L3',['s2'],'self')]);

  createClass('L1','t1','s3');   /* 自有班 · 王老师 */
  createClass('L1','t2','s4');   /* 自有班 · 李老师 */
  createClass('L1','t3','s2');   /* 外包班 · Nguyễn 老师 */
  createClass('L2','t1','s1');   /* 自有班 · 王老师（人少，演示「差 N 人」）*/

  /* 同级别平行班进度必须一致，否则插班错位 */
  S.classes.forEach(c => { c.lesson = c.level === 'L1' ? 7 : 12; });

  S.applications = [
    { id:'a1', teacherName:'Trần 老师', src:'out', level:'L1', slotId:'s2', count:9,
      note:'自带 9 名学员，申请外包开班', status:'pending', at:Date.now() }
  ];
  render(); toast('已载入示例数据');
}
function reset(){
  if(!confirm('清空所有时段、教师、学员、班级与申请？（成员账号会保留）')) return;
  closeModal();
  const keepMembers = S.members, keepLogin = S.login;
  S = blank();
  S.members = keepMembers; S.login = keepLogin;
  render(); toast('已重置');
}

/* ==================== 启动 ==================== */
render();

/* 课程体系目录：先用手上那份（内置兜底）把首屏渲染出来，再后台拉一次云上最新 ——
   拿到了就重渲染，拉不到就保持原样。绝不因为网络问题卡住页面。
   弹窗开着时不重渲染，免得把用户正在填的表单冲掉。 */
curriSync().then(ok => {
  if(ok && $('mask').style.display !== 'flex') render();
});
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MGD 排课系统 · 主端</title>
<style>
/* ==========================================================================
   设计系统 · 浅色 Blueprint（双色模式里的「主端」侧）
   —— 保留蓝图的基因：深蓝锚点 / 青线 / 琥珀标注 / 图纸角标 / 极淡网格
   —— 但底色换成浅色，因为主端是「数据密集 + 长时间盯着」的办公工具
   ========================================================================== */
:root{
  /* 底色 + 网格 */
  --bg:#eef3f7;
  --grid:rgba(14,116,144,.055);
  --grid2:rgba(14,116,144,.028);

  /* 面 */
  --surface:#ffffff;
  --surface-2:#f7fafc;
  --surface-3:#eef3f7;

  /* 字 */
  --ink:#0d2436; --ink2:#4a6a80; --ink3:#8aa3b5;

  /* 线 */
  --line:#dbe5ec; --line2:#c2d3de;

  /* 主色：蓝图的亮青在白底不可读，压深成深青 */
  --brand:#0e7490; --brand2:#0891b2; --brand-soft:#e0f2f7; --brand-ink:#0b5f75;

  /* 标注色：蓝图的琥珀，压深 */
  --amber:#b45309; --amber-soft:#fef3e2; --amber-line:#e8cfa8;

  /* 语义色 */
  --ok:#0f7b52; --ok-soft:#e6f5ee; --ok-line:#a8ddc4;
  --warn:#a16207; --warn-soft:#fdf6e3;
  --bad:#b42318; --bad-soft:#fdeceb; --bad-line:#f0bdb8;

  /* 深蓝锚点（侧栏） */
  --navy:#0d2436; --navy-line:rgba(103,232,249,.18); --navy-tx:#9fbdd0; --navy-tx2:#6f93a8;

  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --side-w:238px; --top-h:56px;
}
*{box-sizing:border-box;}
body{
  margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--ui);
  -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    linear-gradient(var(--grid2) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid2) 1px,transparent 1px);
  background-size:96px 96px,96px 96px,24px 24px,24px 24px;
}
a{color:var(--brand);text-decoration:none;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}

/* ---------------- 布局 ---------------- */
#app{display:flex;min-height:100vh;}
#side{
  width:var(--side-w);flex:0 0 auto;background:var(--navy);color:var(--navy-tx);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  background-image:
    linear-gradient(rgba(103,232,249,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(103,232,249,.055) 1px,transparent 1px);
  background-size:32px 32px;
}
#main{flex:1;min-width:0;display:flex;flex-direction:column;}

/* ---------------- 侧栏 ---------------- */
.brand{padding:16px 18px 14px;border-bottom:1px solid var(--navy-line);}
.brand .lg{display:flex;align-items:center;gap:9px;}
.brand .mark{width:26px;height:26px;flex:0 0 auto;border:1.5px solid #67e8f9;position:relative;}
.brand .mark::after{content:"";position:absolute;inset:5px;background:#67e8f9;opacity:.85;}
.brand h1{font-size:14.5px;margin:0;color:#fff;font-weight:650;letter-spacing:.04em;}
.brand p{margin:6px 0 0;font-size:10.5px;color:var(--navy-tx2);font-family:var(--mono);letter-spacing:.06em;}
.nav{padding:8px 0;flex:1;overflow:auto;}
.nav .grp{padding:13px 18px 5px;font-size:10px;letter-spacing:.16em;color:#547f96;font-family:var(--mono);}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 18px;color:var(--navy-tx);
  font-size:13.5px;border-left:3px solid transparent;cursor:pointer;}
.nav a:hover{background:rgba(103,232,249,.07);color:#dff0f8;}
.nav a.on{background:rgba(103,232,249,.12);color:#fff;border-left-color:#67e8f9;}
.nav a svg{flex:0 0 auto;opacity:.9;}
.nav a .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--navy-tx2);}
.nav a.on .cnt{color:#67e8f9;}
.side-foot{padding:11px 18px;border-top:1px solid var(--navy-line);
  font-size:10.5px;color:var(--navy-tx2);font-family:var(--mono);line-height:1.7;}
.side-foot b{color:#ffd166;font-weight:600;}

/* ---------------- 顶栏 ---------------- */
#top{
  height:var(--top-h);flex:0 0 auto;background:rgba(255,255,255,.88);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
  padding:0 20px;position:sticky;top:0;z-index:20;
}
.crumb{font-size:13px;color:var(--ink2);white-space:nowrap;}
.crumb b{color:var(--ink);font-weight:650;}
.crumb .sep{color:var(--ink3);margin:0 7px;}
.sp{flex:1;}
.search{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);
  padding:0 10px;height:32px;min-width:200px;}
.search input{border:0;outline:0;background:transparent;font:13px var(--ui);color:var(--ink);width:100%;}
.search svg{color:var(--ink3);flex:0 0 auto;}

/* ---------------- 按钮 ---------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 13px;
  font:13px var(--ui);background:var(--surface);border:1px solid var(--line2);color:var(--ink);
  cursor:pointer;white-space:nowrap;}
.btn:hover{border-color:var(--brand);color:var(--brand);}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;}
.btn.pri:hover{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff;}
.btn.sm{height:26px;padding:0 9px;font-size:12px;}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2);}
.btn.ghost:hover{background:var(--surface-3);color:var(--brand);}
.burger{display:none;}

/* ---------------- 内容区 ---------------- */
#view{padding:20px 20px 60px;flex:1;min-width:0;}
.page-h{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
.page-h h2{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em;}
.page-h .desc{margin:0;font-size:12.5px;color:var(--ink3);}
.page-h .sp{flex:1;}

/* ---------------- 卡片 ---------------- */
.card{background:var(--surface);border:1px solid var(--line);position:relative;margin-bottom:14px;}
.card.marks::before,.card.marks::after{content:"";position:absolute;width:10px;height:10px;
  border:1.5px solid var(--brand);pointer-events:none;}
.card.marks::before{top:-1px;left:-1px;border-right:0;border-bottom:0;}
.card.marks::after{bottom:-1px;right:-1px;border-left:0;border-top:0;}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 15px;border-bottom:1px solid var(--line);}
.card-h h3{margin:0;font-size:13.5px;font-weight:650;}
.card-h .sub{font-size:11.5px;color:var(--ink3);}
.card-h .sp{flex:1;}
.card-b{padding:15px;}
.card-b.tight{padding:0;}

/* 统计卡 */
/* 统计卡：用显式列数，避免 6 张卡被挤成 5+1 的孤儿行 */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:11px;margin-bottom:14px;}
.stats.n4{grid-template-columns:repeat(4,minmax(0,1fr));}
.stat{background:var(--surface);border:1px solid var(--line);padding:13px 14px;border-left:3px solid var(--line2);}
.stat.acc{border-left-color:var(--brand);}
.stat.amber{border-left-color:#d99427;}
.stat.bad{border-left-color:var(--bad);}
.stat.ok{border-left-color:var(--ok);}
.stat .k{font-size:11.5px;color:var(--ink3);letter-spacing:.03em;}
.stat .v{font-size:23px;font-weight:650;font-family:var(--mono);font-variant-numeric:tabular-nums;
  margin-top:5px;letter-spacing:-.02em;line-height:1.15;}
.stat .v small{font-size:12px;font-weight:400;color:var(--ink3);font-family:var(--ui);margin-left:3px;}
.stat .d{font-size:11.5px;color:var(--ink3);margin-top:5px;}

/* ---------------- 表格 ---------------- */
.tbl-wrap{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  font-weight:650;padding:10px 13px;border-bottom:1px solid var(--line2);background:var(--surface-2);white-space:nowrap;}
/* 单元格不折行：窄屏时让 .tbl-wrap 横向滚动，而不是把「苹果班 AP-01」挤成逐字断行 */
.tbl td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
.tbl tr:last-child td{border-bottom:0;}
.tbl tbody tr:hover td{background:#f8fbfd;}
.tbl .num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;}
.tbl .m{font-family:var(--mono);font-size:12.5px;}
.tbl .nowrap{white-space:nowrap;}

/* ---------------- 标签 / 点 ---------------- */
.tg{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:1px 8px;
  border:1px solid;white-space:nowrap;line-height:1.65;}
.tg.own{color:var(--brand-ink);border-color:#a8d8e6;background:var(--brand-soft);}
.tg.out{color:#8a4a06;border-color:var(--amber-line);background:var(--amber-soft);}
.tg.on{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft);}
.tg.warn{color:var(--warn);border-color:#e8d9a8;background:var(--warn-soft);}
.tg.bad{color:var(--bad);border-color:var(--bad-line);background:var(--bad-soft);}
.tg.off{color:var(--ink2);border-color:var(--line2);background:var(--surface-3);}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 auto;}
.dot.own{background:var(--brand);} .dot.out{background:#d99427;}
.dot.on{background:var(--ok);} .dot.off{background:var(--ink3);}

/* 行首状态环（donut）三态：
   ① 线上 · 正在上课  → 实心 + 呼吸光晕
   ② 线上 · 未开始/已结束 → 空心青环
   ③ 线下            → 无色（灰环空心）
   —— 颜色只出现在线上课那一行，扫一眼就能分辨 */
.donut{width:13px;height:13px;border-radius:50%;display:inline-block;flex:0 0 auto;
  box-sizing:border-box;border:3px solid var(--line2);background:transparent;}
.donut.on{border-color:var(--brand);background:var(--brand-soft);}
.donut.on.live{border-color:var(--brand);background:var(--brand);
  animation:donutBreath 1.8s ease-in-out infinite;}
@keyframes donutBreath{
  0%,100%{box-shadow:0 0 0 0 rgba(14,116,144,.38);}
  55%    {box-shadow:0 0 0 5px rgba(14,116,144,0);}
}
@media (prefers-reduced-motion:reduce){ .donut.on.live{animation:none;} }
/* 图例里的环保持静止，免得和行内那个抢注意力 */
.lg-donut .donut{animation:none !important;}
/* 图例里的环要和文字对齐 */
.lg-donut{display:inline-flex;align-items:center;gap:6px;}

/* ---------------- 工具条 ---------------- */
.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px;}
.bar .sp{flex:1;}
.seg{display:inline-flex;border:1px solid var(--line2);background:var(--surface);}
.seg button{background:transparent;border:0;border-right:1px solid var(--line);padding:0 12px;height:30px;
  font:12.5px var(--ui);color:var(--ink2);cursor:pointer;}
.seg button:last-child{border-right:0;}
.seg button:hover{color:var(--brand);}
.seg button.on{background:var(--brand);color:#fff;}
select.inp,input.inp{height:30px;border:1px solid var(--line2);background:var(--surface);
  font:13px var(--ui);color:var(--ink);padding:0 9px;outline:0;min-width:0;}
select.inp:focus,input.inp:focus{border-color:var(--brand);}
.lbl{font-size:12px;color:var(--ink3);}

/* ---------------- 子页签 ---------------- */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line2);margin-bottom:16px;overflow-x:auto;}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:9px 15px;
  font:13.5px var(--ui);color:var(--ink2);cursor:pointer;margin-bottom:-1px;white-space:nowrap;}
.tabs button:hover{color:var(--brand);}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:650;}

/* ---------------- 排课矩阵 ---------------- */
.mx-wrap{overflow-x:auto;}
.mx{border-collapse:collapse;font-size:12.5px;min-width:640px;width:100%;}
.mx th,.mx td{border:1px solid var(--line);}
.mx thead th{background:var(--surface-2);padding:8px 6px;font-size:10.5px;color:var(--ink3);
  text-transform:uppercase;letter-spacing:.08em;font-weight:650;text-align:center;}
.mx th.rowh{text-align:left;padding:8px 12px;width:126px;background:var(--surface-2);}
.mx th.rowh .s{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:.02em;text-transform:none;}
.mx td.cell{height:56px;padding:4px 5px;vertical-align:top;min-width:104px;}
.mx td.empty{background:repeating-linear-gradient(45deg,transparent 0 5px,rgba(14,116,144,.04) 5px 10px);}
.chip{display:block;background:var(--brand-soft);border-left:3px solid var(--brand);padding:4px 7px;
  font-size:11.5px;color:var(--brand-ink);line-height:1.45;}
.chip.off{background:var(--amber-soft);border-left-color:#d99427;color:#8a4a06;}
/* 班级名那行：环 + 班名，班名过长时省略号 */
.chip b{display:flex;align-items:center;gap:5px;font-weight:650;}
.chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* 卡片里的环要小一号，配 11.5px 的字 */
.chip .donut{width:10px;height:10px;border-width:2.5px;}
/* 课次与教师各占一行并禁止折行，否则「王雅琴」会被断成「王雅 / 琴」 */
.chip .ln,.chip .tn{display:block;opacity:.8;font-family:var(--mono);font-size:10.5px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ---------------- 其它 ---------------- */
.empty{padding:40px 20px;text-align:center;color:var(--ink3);font-size:13px;}
.empty .big{font-size:15px;color:var(--ink2);margin-bottom:6px;}
.note{background:var(--brand-soft);border-left:3px solid var(--brand);padding:11px 14px;font-size:12.5px;
  color:var(--brand-ink);margin-bottom:14px;}
.note.amber{background:var(--amber-soft);border-left-color:#d99427;color:#8a4a06;}
.note b{font-weight:650;}
/* 异常清单里可点开的条目（点一下 → 打开对应档案 / 跳到班级子页签） */
.note[data-open], .note[data-act]{cursor:pointer;}
.note[data-open]:hover, .note[data-act]:hover{filter:brightness(.97);}
.note .go{display:inline-block;margin-top:6px;font-weight:650;text-decoration:underline;
  text-underline-offset:2px;text-decoration-thickness:1px;}
.bar-mini{height:6px;background:var(--surface-3);position:relative;overflow:hidden;min-width:56px;}
.bar-mini i{position:absolute;left:0;top:0;bottom:0;background:var(--brand);}
.bar-mini i.hi{background:#d99427;}
.bar-mini i.full{background:var(--ok);}
/* ---------------- 课次记录页 · 月份条 ---------------- */
.mbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:9px 11px;
  background:var(--surface);border:1px solid var(--line);}
.mbtn{position:relative;font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--line2);
  background:transparent;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
.mbtn:hover{border-color:var(--brand);color:var(--brand);}
.mbtn.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:650;}
.mbtn .yr{font-style:normal;font-size:10.5px;opacity:.55;font-weight:600;}
.mbtn.on .yr{opacity:.85;}
/* 未来月份：可选，但虚线框 + 选中时换成琥珀色 —— 一眼看出「还没开始」 */
.mbtn.fut{border-style:dashed;}
.mbtn.fut.on{background:var(--amber);border-color:var(--amber);color:#fff;}
.flow{background:var(--surface-2);border:1px solid var(--line);padding:12px 14px;overflow:auto;
  font:12px/1.85 var(--mono);color:var(--ink2);white-space:pre;}
.scrim{display:none;position:fixed;inset:0;background:rgba(13,36,54,.45);z-index:50;}

/* ---------------- 响应式 ---------------- */
/* 6 列需要 ≥1240px 才放得下，否则每张卡不足 150px、数字会溢出 → 中间档降到 3 列 */
@media (max-width:1240px){
  .stats{grid-template-columns:repeat(3,minmax(0,1fr));}
  .stats.n4{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media (max-width:920px){
  #side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .22s ease;}
  #side.open{transform:none;}
  .scrim.on{display:block;}
  .burger{display:inline-flex;}
  #view{padding:14px 14px 50px;}
  #top{padding:0 14px;gap:8px;}
  .search{min-width:0;flex:1;}
  .crumb{display:none;}
  .stats,.stats.n4{gap:9px;}
  .stat .v{font-size:20px;}
  .page-h h2{font-size:18px;}
}
@media (max-width:560px){
  .stats,.stats.n4{grid-template-columns:repeat(2,minmax(0,1fr));}
}

/* ---------------- 右侧抽屉 · 个人档案 ----------------
   注意：这里刻意**不复用** .scrim —— 它的显示规则 .scrim.on 被关在
   @media (max-width:920px) 里（见上），桌面端加了 .on 也不会显示。
   层级：#top(20) < #scrim(50) < #side 窄屏(60) < #dScrim(65) < #drawer(70) */
#dScrim{display:none;position:fixed;inset:0;background:rgba(13,36,54,.45);z-index:65;}
#dScrim.on{display:block;}
#drawer{position:fixed;top:0;right:0;height:100vh;width:min(430px,92vw);
  background:var(--surface);border-left:1px solid var(--line2);
  box-shadow:-10px 0 28px rgba(13,36,54,.12);z-index:70;
  display:flex;flex-direction:column;transform:translateX(100%);
  transition:transform .22s ease,visibility .22s;visibility:hidden;}
#drawer.open{transform:none;visibility:visible;}
#drawer:not(.open){pointer-events:none;}
#drawer .d-h{display:flex;align-items:center;gap:10px;padding:13px 16px;
  border-bottom:1px solid var(--line);background:var(--surface-2);}
#drawer .d-h .t{font-weight:650;font-size:14.5px;color:var(--ink);}
#drawer .d-h .s{font-size:11.5px;color:var(--ink3);font-family:var(--mono);}
#drawer .x{margin-left:auto;width:28px;height:28px;border:1px solid var(--line2);
  background:var(--surface);color:var(--ink2);cursor:pointer;font-size:15px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;}
#drawer .x:hover{color:var(--brand);border-color:var(--brand);}
#drawer .d-b{padding:16px;overflow:auto;flex:1;}
#drawer .d-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;
  gap:8px;align-items:center;background:var(--surface-2);}
#drawer .d-f .sp{flex:1;}   /* .sp 的 flex:1 只写在 .bar 作用域里，这里要自建 */
.d-memo{font-size:11.5px;color:var(--warn);line-height:1.5;text-align:right;}
/* 查看态：键值网格 */
.kv{display:grid;grid-template-columns:94px 1fr;gap:9px 12px;font-size:13px;align-items:start;}
.kv dt{color:var(--ink3);font-size:12px;}
.kv dd{margin:0;color:var(--ink);min-width:0;}
.kv .mono{font-family:var(--mono);}
/* 编辑态：字段 */
.fld{margin-bottom:12px;}
.fld > .lbl{display:block;margin-bottom:5px;}
.fld .inp{width:100%;box-sizing:border-box;}
.fld textarea.inp{height:auto;min-height:62px;padding:7px 9px;line-height:1.5;
  font-family:var(--ui);resize:vertical;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
/* 多选 chips —— 刻意不用 .seg：事件委托里的 `.seg button` 分支没有作用域限定 */
.picks{display:flex;flex-wrap:wrap;gap:6px;}
.pick{border:1px solid var(--line2);background:var(--surface);color:var(--ink2);
  font:12.5px var(--ui);padding:4px 10px;cursor:pointer;}
.pick:hover{border-color:var(--brand);color:var(--brand);}
.pick.on{background:var(--brand);border-color:var(--brand);color:#fff;}
/* 表格行可点开档案 */
tr[data-open]{cursor:pointer;}
tr[data-open]:hover td{background:var(--brand-soft);}
@media (max-width:560px){
  #drawer{width:100%;}

@media (prefers-reduced-motion:reduce){ #drawer{transition:none;} }

/* ---------------- 开班申请 · 审批（抽屉内的分区块） ---------------- */
#drawer .a-sec{border:1px solid var(--line);background:var(--surface-2);padding:12px 13px;margin-bottom:12px;}
#drawer .a-sec h4{margin:0 0 10px;font-size:11.5px;letter-spacing:.08em;color:var(--ink3);font-weight:650;}
.a-clash{background:var(--bad-soft);border-left:3px solid var(--bad);color:#8f1d14;
  padding:9px 12px;font-size:12.5px;line-height:1.65;margin-top:10px;}
.a-ok{background:var(--ok-soft);border-left:3px solid var(--ok);color:#0b5c3d;
  padding:9px 12px;font-size:12.5px;line-height:1.65;margin-top:10px;}
.a-warn{background:var(--amber-soft);border-left:3px solid #d99427;color:#8a4a06;
  padding:9px 12px;font-size:12.5px;line-height:1.65;margin-top:10px;}
/* 紧跟标题的第一块不要再顶出 10px */
#drawer .a-sec h4 + .a-ok,
#drawer .a-sec h4 + .a-clash,
#drawer .a-sec h4 + .a-warn{margin-top:0;}
#drawer .btn[disabled]{opacity:.42;cursor:not-allowed;}
/* 页脚可能有 2 个按钮 + 说明；按钮不许被压扁，说明允许收缩换行 */
#drawer .d-f .btn{flex:0 0 auto;}
#drawer .d-f .d-memo{min-width:0;}
.fld .ro{height:30px;line-height:28px;padding:0 9px;box-sizing:border-box;background:var(--surface-3);
  border:1px solid var(--line);color:var(--ink3);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 新建开班申请 · 学生名单：一行 = 序号 + 姓名 + 电话 + 删 */
#drawer .stu-row{display:flex;align-items:center;gap:7px;margin-bottom:7px;}
#drawer .stu-row .n{flex:0 0 17px;font-family:var(--mono);font-size:11.5px;color:var(--ink3);text-align:right;}
#drawer .stu-row .inp{flex:1 1 0;min-width:0;}
#drawer .stu-row .x2{flex:0 0 auto;width:26px;height:26px;padding:0;border:1px solid var(--line2);
  background:var(--surface);color:var(--ink3);cursor:pointer;font-size:12px;line-height:1;border-radius:0;}
#drawer .stu-row .x2:hover{color:var(--bad);border-color:var(--bad-line);background:var(--bad-soft);}

/* 时间小工具：状态环的「正在上课」就靠这两个 */
const toMin = s => { const p = String(s).split(':'); return (+p[0])*60 + (+p[1]); };
const endOf = t => { const e = toMin(t) + DB.lessonMin;
  return String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0'); };
const isLive = r => r.mode==='online'
  && toMin(DB.now) >= toMin(r.time)
  && toMin(DB.now) <  toMin(r.time) + DB.lessonMin;

/* 矩阵的「时段」是 "07:30–08:15" 这种区间串，取开始时间来判断此刻是否在课 */
const slotStart = t => String(t).split(/[–—\-]/)[0].trim();
const slotLive  = t => { const s = toMin(slotStart(t));
  return toMin(DB.now) >= s && toMin(DB.now) < s + DB.lessonMin; };

/* ================= 事实层 → 推导层 =================
   ★ 三层架构（Tony 2026-10-03 定案）：
       ① 事实层 —— 有明确发生时间的记录（课次 lessons / 缺勤 absences / 开班申请 apps）
       ② 推导层 —— 查询时现算，不落库（classLesson / stuAtt / DB.today 都在这一层）
       ③ 总览   —— 只读，自己一个数都不存
   ★ 一句话：凡是能算出来的，就不许手写。 */

/* 星期名 → 数字（0=周日 … 6=周六）。从 slot.days 字符串解析出来，
   不再让每个用到的地方各写一份硬编码 */
const DAY_NAMES = ['周日','周一','周二','周三','周四','周五','周六'];
function slotDays(sl){
  const out = [];
  DAY_NAMES.forEach((n, i) => { if (String(sl.days || '').indexOf(n) >= 0) out.push(i); });
  return out;
}
const ymd = d => d.getFullYear() + '-' +
  String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
function addDays(iso, n){ const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); }

/* 播种课次事实表：从班级 startedAt 起，按它时段的星期几往后排，
   一直排到「今天 + 14 天」—— 所以课表里既有已上的，也有待上的。
   ⚠️ 这是演示数据的生成器，上云后由真实的排课动作取代；lessons 表结构不变。 */
function seedLessons(){
  const out = [];
  DB.classes.forEach(c => {
    const sl = S(c.slot);
    const days = slotDays(sl);
    if (!days.length || !c.startedAt) return;
    /* 往后排 45 天 —— 排到六周后，这样月份条上会出现「未来月份」（边界 #8：
       可选中，但要标「未开始」）。真实系统里就是排课排到几周之后的样子。 */
    const stop = addDays(DB.todayDate, 45);
    let d = c.startedAt, no = 0, guard = 0;
    while (d <= stop && no < (c.plannedLessons || 42) && guard++ < 900){
      if (days.indexOf(new Date(d + 'T00:00:00').getDay()) >= 0){
        no++;
        out.push({
          id: c.id + '#' + no, cid: c.id, no: no, date: d, time: sl.time,
          status: d < DB.todayDate ? 'done' : (d === DB.todayDate ? 'today' : 'plan'),
        });
      }
      d = addDays(d, 1);
    }
  });
  return out.sort((a, b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
}

/* 班级进度 = 该班「已经上完」的课次数（由事实表数出来，不手写） */
function classLesson(c){
  return DB.lessons.filter(l => l.cid === c.id && l.status === 'done').length;
}
const lessonsOf = cid => DB.lessons.filter(l => l.cid === cid);

/* 学生哪天进的这个班：演示数据里默认 = 班级开班日（整班一起进来的）；
   中途插班的（比如从开班申请名单编进来的）才单独写 joinedAt */
const stuJoinedAt = s => s.joinedAt || (s.cls ? (C(s.cls).startedAt || '') : '');
/* 应出勤 = 该生入班之后，这个班已经上过的课次数 */
function stuAttAll(s){
  if (!s.cls) return 0;
  const from = stuJoinedAt(s);
  return DB.lessons.filter(l => l.cid === s.cls && l.status === 'done' &&
    (!from || l.date >= from)).length;
}
/* 缺勤次数：从缺勤事实表数出来（只记缺勤，默认全勤） */
function stuAbsent(s){
  if (!s.cls) return 0;
  const ls = lessonsOf(s.cls);
  return DB.absences.filter(a => a.sid === s.id).filter(a => {
    const l = ls[a.no - 1];
    return !!l && l.status === 'done';
  }).length;
}
/* 实出勤 = 应出勤 − 缺勤 */
const stuAtt = s => Math.max(0, stuAttAll(s) - stuAbsent(s));

/* 把事实层算成「当下」。只跑一次，启动时执行 */
function buildFacts(){
  DB.lessons = seedLessons();
  /* 今日课程 = 事实表按「今天」查出来 —— 不再是手写数组。
     ⚠️ 以前那个手写的 today[] 跟班级时段对不上（周一/周三的班能出现在周六的今日课程里）。
        现在只会出现「今天真的有课」的班。 */
  DB.today = DB.lessons
    .filter(l => l.date === DB.todayDate && l.status !== 'cancel')
    .sort((a, b) => toMin(slotStart(a.time)) - toMin(slotStart(b.time)))
    .map(l => {
      const c = C(l.cid);
      /* time 只给开始时间 —— 表格里显示时再拼上 endOf()，isLive() 也靠它 */
      return {cls:l.cid, teacher:c.teacher, mode:c.mode, time:slotStart(l.time), lesson:l.no, status:l.status};
    });
}

/* ================= 视图：课次记录（按月回看） =================
   ★ Tony 2026-10-03 定案的四条：
     ① 独立侧栏页，不并在总览 —— 总览永远「当下」，这里专门「回看」
     ② 月份条只在本页显示（路线 A），不挪顶栏
     ③ 月份 = 查询参数（mSel），不落库；「在读」用推导算，不存快照
     ④ 补课 / 调课按「实际上课那天」记 —— 所以一切以 lesson.date 为准 */

/* ---------- 月份小工具 ---------- */
const WK = ['日','一','二','三','四','五','六'];
const monthOf    = d => String(d).slice(0, 7);
const monthStart = m => m + '-01';
/* 第 mm 月的「第 0 天」= 上个月最后一天，正好拿到本月最后一天 */
const monthEnd   = m => ymd(new Date(Number(m.slice(0,4)), Number(m.slice(5,7)), 0));
function nextMonth(m){
  const y = Number(m.slice(0,4)), mm = Number(m.slice(5,7));
  return mm === 12 ? (y + 1) + '-01' : y + '-' + String(mm + 1).padStart(2,'0');
}
const monthText   = m => m.slice(0,4) + ' 年 ' + Number(m.slice(5,7)) + ' 月';
const weekdayText = d => '周' + WK[new Date(d + 'T00:00:00').getDay()];

const lessonsIn = m => DB.lessons.filter(l => monthOf(l.date) === m);

/* ★ 该班「到某个月底为止」已上过多少节 —— 不是「到今天为止」。
   回看历史月时，进度也得是当时的进度（Tony 边界 #12：跨月实体快照用推导法）。
   查当月时，它就等于 classLesson(c)。 */
function classLessonAsOf(c, m){
  return DB.lessons.filter(l => l.cid === c.id && l.status === 'done' && l.date <= monthEnd(m)).length;
}

/* ★「某月在读」判定公式（Tony 边界 #1 / #12 定案）：
     开班日 ≤ 该月最后一天  AND（还没结课 OR 结课日 ≥ 该月第一天）
   —— 跨月未结课的班，在它存在的**每一个月**里都要出现，不是只在开班那个月。 */
function classLiveIn(c, m){
  if (!c.startedAt || c.startedAt > monthEnd(m)) return false;
  if (c.endedAt && c.endedAt < monthStart(m)) return false;
  return true;
}

/* 月份条 = 有课次的月份 ∪ 有班级在读的月份 ∪ 当月，升序。
   把「在读但没有课」的月份也算进来 —— 边界 #4「整月没上课」也要能选到 */
function monthList(){
  const set = {};
  DB.lessons.forEach(l => { set[monthOf(l.date)] = 1; });
  DB.classes.forEach(c => {
    if (!c.startedAt) return;
    const to = c.endedAt ? monthOf(c.endedAt) : monthOf(DB.todayDate);
    let m = monthOf(c.startedAt), guard = 0;
    while (m <= to && guard++ < 600){ set[m] = 1; m = nextMonth(m); }
  });
  set[monthOf(DB.todayDate)] = 1;
  return Object.keys(set).sort();
}

/* 该月「计入统计」的课次 = 已上 + 今天。
   ★ 不含 cancel —— 边界 #10：不计数，但记录留着（会计红冲：账不能撕，只能冲销） */
const monthCounted = m => lessonsIn(m).filter(l => l.status === 'done' || l.status === 'today');
/* 该月缺勤人次：把缺勤事实按课次反查回日期，再按月份筛 */
function monthAbsent(m){
  return DB.absences.filter(a => {
    const l = lessonsOf(a.cid)[a.no - 1];
    return !!l && l.status === 'done' && monthOf(l.date) === m;
  }).length;
}

let mSel = '';   /* 选中的月份（YYYY-MM）。空 = 跟着「当月」走 */

function vLessons(){
  const cur = monthOf(DB.todayDate);
  const months = monthList();
  if (!mSel || months.indexOf(mSel) < 0) mSel = cur;
  const m = mSel;
  const list    = lessonsIn(m);
  const counted = monthCounted(m);
  const plan    = list.filter(l => l.status === 'plan');
  const cancel  = list.filter(l => l.status === 'cancel');
  const future  = m > cur;
  const live    = DB.classes.filter(c => classLiveIn(c, m));
  const cids = {}; list.forEach(l => { cids[l.cid] = 1; });

  /* 明细：按日期 + 开始时间排 */
  const rows = list.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1
    : toMin(slotStart(a.time)) - toMin(slotStart(b.time)));

  /* 月份条：跨年时在当年第一个按钮上补一个年份小标 */
  let lastY = '';
  const bar = months.map(mm => {
    const y = mm.slice(0,4);
    const yr = y !== lastY ? '<i class="yr">' + y + '</i>' : '';
    lastY = y;
    return '<button class="mbtn' + (mm === m ? ' on' : '') + (mm > cur ? ' fut' : '') +
      '" data-m="' + mm + '">' + yr + Number(mm.slice(5,7)) + ' 月</button>';
  }).join('');

  return `
  <div class="page-h">
    <div><h2>课次记录</h2><p class="desc">按月回看 · 每节课都记在事实上，不是事后补的汇总</p></div>
    <div class="sp"></div>
    ${future ? '<span class="tg warn">未开始</span>'
             : (m === cur ? '<span class="tg on">本月</span>' : '<span class="tg off">历史</span>')}
    <a class="btn" href="#overview">回总览（看当下）</a>
  </div>

  <div class="mbar" id="mbar">${bar}</div>

  <div class="stats">
    ${stat(monthText(m) + ' 课次', counted.length, '节' + (cancel.length ? ' · 另有已取消 ' + cancel.length + ' 节' : ''), 'acc')}
    ${stat('已上', counted.filter(l => l.status === 'done').length, '节')}
    ${stat('今天', counted.filter(l => l.status === 'today').length, '节')}
    ${stat('待上', plan.length, '节')}
    ${stat('涉及班级', Object.keys(cids).length, '个 · 在读 ' + live.length + ' 个')}
    ${stat('该月缺勤', monthAbsent(m), '人次')}
  </div>

  <div class="card marks">
    <div class="card-h"><h3>${monthText(m)} 明细</h3>
      <span class="sub">按实际上课那天记 —— 补课 / 调课也算上课那天</span><span class="sp"></span>
      ${list.length ? '<span class="tg off">共 ' + list.length + ' 条</span>' : ''}</div>
    <div class="card-b tight">
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>日期</th><th>班级</th><th>进度</th><th>时段</th><th>形态</th><th>授课教师</th><th>教室</th><th>状态</th></tr></thead>
        <tbody>${rows.length ? rows.map(l => {
          const c = C(l.cid), t = T(l.teacher || c.teacher);
          /* 代课：这节课的授课教师 ≠ 班级的常任教师（边界 #11）—— 必须显示出来，
             否则将来跟老师对账时「这节课到底谁上的」说不清 */
          const sub = l.teacher && l.teacher !== c.teacher;
          const st = l.status === 'done'   ? '<span class="tg on">已上</span>'
                   : l.status === 'today'  ? '<span class="tg warn">今天</span>'
                   : l.status === 'cancel' ? '<span class="tg bad">已取消</span>'
                   :                         '<span class="tg off">待上</span>';
          /* 已取消的整行压暗 —— 一眼看出来它「在，但不算数」 */
          return '<tr' + (l.status === 'cancel' ? ' style="opacity:.55"' : '') + '>' +
            '<td class="m nowrap">' + l.date + ' <span style="color:var(--ink3)">' + weekdayText(l.date) + '</span></td>' +
            '<td><b>' + esc(c.name) + '</b> <span class="m" style="color:var(--ink3)">' + c.code + '</span></td>' +

/* ==========================================================================
   右侧抽屉 · 个人档案
   —— 教师页 / 学生页点任意一行 → 右侧滑出档案面板
   —— 「可改」只是内存态：直接改 DB 对象，刷新页面即还原，不写任何存储
   ========================================================================== */
let dState = null;   /* {kind:'teacher'|'student'|'app', id, edit, draft, mode, form, isNew} */

function getDRec(){
  if (!dState) return null;
  if (dState.kind === 'teacher') return DB.teachers.find(x => x.id === dState.id);
  if (dState.kind === 'student') return DB.students.find(x => x.id === dState.id);
  if (dState.kind === 'app')     return DB.apps.find(x => x.id === dState.id);
  return null;
}
function openDrawer(key){
  const parts = String(key).split(':');
  const kind = parts[0], id = parts[1];
  if (kind !== 'teacher' && kind !== 'student' && kind !== 'app') return;
  dState = {kind:kind, id:id, edit:false, draft:null, mode:'view', form:null, isNew:false};
  /* 记录不存在就别开 —— 否则 renderDrawer 会清空内容，
     而这里又把 .open 加上去，会留下一个空白抽屉 */
  if (!getDRec()){ dState = null; return; }
  if (kind === 'app') dState.form = appFormOf(getDRec());
  renderDrawer();
  $('#dScrim').classList.add('on');
  $('#drawer').classList.add('open');
  $('#drawer').setAttribute('aria-hidden','false');
  const x = $('#drawer .x');
  if (x) x.focus();
}
function closeDrawer(){
  if (!dState) return;
  dState = null;
  $('#drawer').classList.remove('open');
  $('#dScrim').classList.remove('on');
  $('#drawer').setAttribute('aria-hidden','true');
  $('#drawer').innerHTML = '';
}
/* 保存后刷新列表行 —— 只重写 #view。
   绝不能用 render()：render() 末尾会 closeDrawer()，抽屉会把自己关掉 */
function refreshView(){
  const id = route();
  $('#view').innerHTML = (R[id] || vOverview)();
}
function startEdit(){
  const o = getDRec();
  if (!o) return;
  dState.edit = true;
  dState.draft = JSON.parse(JSON.stringify(o));   /* 深拷贝，取消时不影响原对象 */
  renderDrawer();
}
function cancelEdit(){
  if (!dState) return;
  /* 新建时点「取消」= 放弃这条，直接关抽屉；编辑时 = 回到查看态 */
  if (dState.isNew){ closeDrawer(); return; }
  dState.edit = false; dState.draft = null; renderDrawer();
}
function saveEdit(){
  if (!dState || !dState.draft) return;
  /* 文本框 / 下拉的值还留在 DOM 里，必须先读回来；数组（多选 chips）已经在 draft 上 */
  $('#drawer').querySelectorAll('[data-d-inp]').forEach(el => {
    const f = el.dataset.dInp;
    let v = el.value;
    if (f === 'rate' || f === 'perfScore') v = Number(v) || 0;
    dState.draft[f] = v;
  });
  const d = dState.draft;

  /* ---- 新建：push 一条新记录 ---- */
  if (dState.isNew){
    const kind = dState.kind;
    /* 姓名 + 联系方式必填（Tony 2026-10-03：联系方式也要必填，不然新建出来联系不上人） */
    const miss = [];
    if (!String(d.name||'').trim()) miss.push('姓名');
    if (!String(d[kind === 'teacher' ? 'tel' : 'phone']||'').trim()) miss.push('联系方式');
    if (miss.length){ dState.err = miss.join(' 和 '); renderDrawer(); return; }

    const list = kind === 'teacher' ? DB.teachers : DB.students;
    const nums = list.map(x => parseInt(String(x.id).replace(/\D/g,''), 10) || 0);
    d.id   = (kind === 'teacher' ? 't' : 'st') + (Math.max(0, ...nums) + 1);
    d.name = String(d.name).trim();
    list.push(d);
    const view = kind === 'teacher' ? 'teachers' : 'students';
    closeDrawer();
    /* hash 没变时 hashchange 不触发，得手动 render() */
    if (location.hash === '#' + view) render(); else location.hash = '#' + view;
    return;
  }

  /* ---- 编辑：写回原对象 ---- */
  const o = getDRec();
  if (!o) return;
  Object.keys(d).forEach(k => { o[k] = d[k]; });
  dState.edit = false; dState.draft = null;
  renderDrawer();
  refreshView();
}
/* 多选 chip：只改 draft + 原地 toggle class，不整块重绘（重绘会清掉已填的输入框） */
function togglePick(btn){
  if (!dState || !dState.draft) return;
  const f = btn.dataset.dPick, v = btn.dataset.val;
  const arr = dState.draft[f];
  if (!Array.isArray(arr)) return;
  const i = arr.indexOf(v);
  if (i >= 0) arr.splice(i,1); else arr.push(v);
  btn.classList.toggle('on');
}

/* ---- 编辑态 ----
   ⚠ 所有控件都不能带 data-f：会被全局 change 委托截获并触发 render()，把抽屉冲掉
   ⚠ 绝不能出现 .seg：全局 click 委托里的 `.seg button` 分支没有作用域限定 */
function fld(label, ctrl){

}
/* attr 默认 data-d-inp（个人档案用）；开班申请的表单传 data-a-inp，两套互不干扰 */
function inp(f, v, type, attr){
  return '<input class="inp" '+(attr||'data-d-inp')+'="'+f+'" type="'+(type||'text')+'" value="'+esc(v)+'">';

/* ==========================================================================
   开班申请 · 审批闭环（7 步）
   第 1 步 校验主体是「操作员」—— 只看时间 / 课室碰撞 + 内容有没有问题。
           人数门槛（8–12）只作参考显示，不拦通过。
   第 2 步 找已有班：级别 + 时段 + 形态 相同、阶段相同、并入后不超容量 → 归入该班
   第 3 步 没命中 → 建班表单（预填可改），预填值随来源走（自家 / 外包不一样）
   第 4 步 已成立的班只审时间，其余字段不反复审
   第 5 步 确认后一次性：置「已通过」+ 登记教师可授时段 + 建班／归入已有班
   第 6 步 驳回必须填原因（时间碰撞 / 线下课室被占）+ 反建议时段
   第 7 步 列表筛选条：全部 / 待审批 / 已通过 / 已驳回 + 按具体驳回原因
   ========================================================================== */

/* 演示用水果班名 / 代号 —— 跟 c1–c5 同一套命名，新开班顺着往下取 */
const FRUIT = [['苹果','AP'],['凤梨','DN'],['芒果','MG'],['荔枝','LZ'],['龙眼','LY'],
               ['榴莲','LL'],['山竹','SZ'],['红毛丹','HMD'],['椰子','YZ'],['火龙果','HLG']];

/* 申请来源 → 归属：own=自家外境 → 自有；out=外包外境 → 外包；
   edit=操作员自己编辑的排班 → 按这位教师的档案 */
function appOwn(a){
  if (a.src === 'own') return 'own';
  if (a.src === 'out') return 'out';
  return T(a.teacher).src || 'own';
}
/* 进度文案：第一阶段 · 第 3 课（阶段由课次反查，跟 STAGE() 同一套分档） */
const progOf   = n => n > 0 ? stageName(n) + ' · 第 ' + n + ' 课' : '尚未开课';
const progText = a => progOf(a.lesson);

/* 建班表单里改了教室 → 碰撞检查要用新教室重算，不能还用申请里的旧教室 */
function roomOf(o){
  return (dState && dState.form && dState.form.room != null) ? dState.form.room : (o.room || '');
}

/* ---- 系统查碰撞（第 4 步）----
   返回 null = 没碰撞；否则 {kind:'clash'|'room', hit, what} */
function clashOf(a){
  /* ① 教师时间碰撞：同一位教师在同一时段已经有班 */
  const tc = DB.classes.find(c => c.slot === a.slot && c.teacher === a.teacher);
  if (tc) return {kind:'clash', hit:tc, what:'class'};
  /* ② 已经有通过的申请占了同一位教师的同一时段 */
  const ta = DB.apps.find(x => x !== a && x.state === '已通过' && x.slot === a.slot && x.teacher === a.teacher);
  if (ta) return {kind:'clash', hit:null, what:'app', app:ta};
  /* ③ 线下教室碰撞：线上课不占教室，只有线下才查（课室总数待 Tony 提供） */
  const room = roomOf(a);
  if (a.mode === 'offline' && room){
    const rc = DB.classes.find(c => c.mode === 'offline' && c.slot === a.slot && c.room && c.room === room);
    if (rc) return {kind:'room', hit:rc, what:'class'};
  }
  return null;
}

/* ---- 找已有班（第 2 步）----
   并的是「课」不是「人」：这个时段本来就有一门同样的课，新学生放进它的空位 */
function findMatch(a){
  return DB.classes.find(c =>
    c.lv === a.lv && c.slot === a.slot && c.mode === a.mode &&
    stageOf(classLesson(c)) === stageOf(a.lesson) &&
    c.n + a.n <= c.cap
  ) || null;
}

/* ---- 建班 / 驳回的表单草稿 ---- */
function appFormOf(o){
  const used = DB.classes.map(c => c.name);
  const f = FRUIT.find(x => used.indexOf(x[0] + '班') < 0) || ['新班','NW'];
  const n = DB.classes.length + 1;
  const cl = clashOf(o);
  return {
    /* 第 3 步：预填跟来源走 —— 自家教师 / 外包教师默认值不一样 */
    name: f[0] + '班',
    code: f[1] + '-' + String(n).padStart(2,'0'),
    cap: DB.set.capMax,
    room: o.room || '',
    own: appOwn(o),
    /* 第 6 步：驳回原因。系统查到碰撞就预填那一项，没查到就必须自己选（驳回要给理由） */
    reason: cl ? cl.kind : '',
    advice: '',
    note: '',
  };
}
/* 把抽屉里 data-a-inp 的值读回草稿（用户可能改过预填值） */
function readAppForm(){
  if (!dState || !dState.form) return;
  $('#drawer').querySelectorAll('[data-a-inp]').forEach(el => {
    dState.form[el.dataset.aInp] = el.value;
  });
  /* 学生名单是一组同名字段（data-a-roster + data-i），按行号收回来。
     ⚠ 不能塞进上面的 data-a-inp 里 —— 那会在每次输入 change 时触发重画，焦点会丢 */
  if (dState.form.roster){
    const rows = {};
    $('#drawer').querySelectorAll('[data-a-roster]').forEach(el => {
      const i = Number(el.dataset.i) || 0;
      const r = rows[i] || (rows[i] = { name:'', phone:'' });
      r[el.dataset.aRoster] = el.value;
    });
    const keys = Object.keys(rows).map(Number).sort((a, b) => a - b);
    if (keys.length) dState.form.roster = keys.map(k => rows[k]);
  }
}

function createApp(){
  readAppForm();
  const f = dState.form;
  const room = String(f.room||'').trim();
  if (!f.teacher || !f.lv || !f.slot || !f.mode) return;
  if (f.mode === 'offline' && !room) return;      /* 线下不填教室，碰撞就没法判 */
  const nums = DB.apps.map(a => parseInt(String(a.id).replace(/\D/g,''), 10) || 0);
  const id = 'a' + (Math.max(0, ...nums) + 1);
  /* 学生名单：只收填了姓名的行 */
  const roster = (f.roster || [])
    .map(s => ({ name: String(s.name||'').trim(), phone: String(s.phone||'').trim() }))
    .filter(s => s.name);
  DB.apps.unshift({
    id: id, src: 'edit', teacher: f.teacher, lv: f.lv,
    stage: stageOf(1), lesson: 1,
    mode: f.mode, slot: f.slot,
    room: f.mode === 'offline' ? room : '',
    n: Math.max(0, parseInt(f.n, 10) || 0),
    roster: roster,
    at: stamp(), state: '待审批',
  });
  closeDrawer();
  /* hash 没变时 hashchange 不触发，得手动 render() */
  if (location.hash === '#apply') render(); else location.hash = '#apply';
}

/* 把申请里的学生名单落成学生档案 + 编入这个班。
   这样「每位学生跟哪位教师」在档案里就有据可查（归属教师 = 班的教师）。
   ⚠ 班人数由调用方（approveApp 的 addN）负责加，这里不要再 c.n++，否则会重复计数。 */
function addStudentsFromRoster(o, classId){
  const roster = (o.roster || []).filter(r => r && String(r.name||'').trim());
  if (!roster.length) return 0;
  const nums = DB.students.map(s => parseInt(String(s.id).replace(/\D/g,''), 10) || 0);
  let seq = Math.max(0, ...nums);
  roster.forEach(r => {
    seq++;
    DB.students.push({
      id: 'st' + seq,
      name: String(r.name).trim(),
      lv: o.lv, own: 'own', cls: classId,
      /* 今天才编进来的 → 入班日 = 今天。所以他的"应出勤"从 0 开始，
         不能拿这个班以前上过的课来算他的出勤 */
      joinedAt: DB.todayDate, intent: '', contact: '本人',
      exam: {}, phone: String(r.phone||'').trim(),
      job: '', grade: '', goal: 'both', source: 'teacher', slots: [o.slot],
    });
  });
  return roster.length;
}

/* ================= 自动编班（候选池 → 已有班） =================
   已定规则：只有「意向班级 + 级别 + 可上课时段」都对得上才编；对不上不编，并标原因。 */
let autoResult = null;
function autoAssign(){
  const pool = DB.students.filter(s => !s.cls && s.intent);
  const done = [], skip = [];
  pool.forEach(s => {
    const c = DB.classes.find(x => x.code === s.intent);
    if (!c)                                   { skip.push(s.name+'（找不到 '+s.intent+'）'); return; }
    if (c.lv !== s.lv)                        { skip.push(s.name+'（级别不符）'); return; }
    if (c.n >= c.cap)                         { skip.push(s.name+'（'+c.name+' 已满 '+c.n+'/'+c.cap+'）'); return; }
    if ((s.slots||[]).length && s.slots.indexOf(c.slot) < 0)
                                              { skip.push(s.name+'（时段对不上）'); return; }
    s.cls = c.id; c.n++;
    done.push(s.name+' → '+c.name);
  });
  autoResult = { done: done, skip: skip, at: stamp() };
  render();
}
function autoBanner(){
  if (!autoResult) return '';
  const d = autoResult.done, s = autoResult.skip;
  return '<div class="note'+(d.length ? '' : ' amber')+'" style="margin:0 0 14px">'+
    '<b>自动编班结果</b>（'+esc(autoResult.at)+'）：编入 '+d.length+' 人'+
    (d.length ? ' —— '+d.map(esc).join('、') : '')+
    (s.length ? '<br>跳过 '+s.length+' 人：'+s.map(esc).join('、') : '')+
    '</div>';
}

/* ---- 通过（第 5 步：一次性完成三件事）---- */
function approveApp(){
  const o = getDRec();
  if (!o || o.state !== '待审批') return;
  if (clashOf(o)) return;          /* 有碰撞，按钮本来就是禁用的，这里双保险 */
  readAppForm();
  const f = dState.form;
  const mt = findMatch(o);
  const t = T(o.teacher);
  /* 有人名单就按名单算人数（只数填了姓名的行），否则按申请里的人数 */
  const rosterN = (o.roster || []).filter(r => r && String(r.name||'').trim()).length;
  const addN = rosterN || o.n;

  if (mt){
    mt.n = mt.n + addN;
    o.link = mt.id; o.linkMode = 'merge';
  } else {
    const nc = {
      id: 'c' + (DB.classes.length + 1) + '-' + Date.now().toString(36),
      code: f.code || ('NW-' + String(DB.classes.length+1).padStart(2,'0')),
      name: f.name || '新班',
      lv: o.lv, mode: o.mode, slot: o.slot,
      teacher: o.teacher,
      /* ⚠️ 不再写死 lesson。新建的班今天才开，事实表里还没有它的课次 → 进度从 0 起算。
         申请里的「第 3 课」说的是"这批学生目前学到第 3 课"，不等于"这个班已经上过 3 节"。 */
      startedAt: DB.todayDate, endedAt: null, plannedLessons: 42,
      cap: Number(f.cap) || DB.set.capMax,
      n: addN,
      room: o.mode === 'offline' ? (f.room || '') : '',
      own: f.own,
    };
    DB.classes.push(nc);
    o.link = nc.id; o.linkMode = 'new';
  }
  o.state = '已通过';
  /* ② 把申请里的时段登记成这位教师的可授时段 */
  if (Array.isArray(t.slots) && t.slots.indexOf(o.slot) < 0) t.slots.push(o.slot);
  /* ③ 名单里的学生 → 学生档案 + 编入这个班（人数已在 addN 里算过，这里不再加） */
  addStudentsFromRoster(o, o.link);

  renderAppDrawer(o);
  refreshView();     /* 列表 + 筛选计数 */
  renderNav();       /* 侧栏「待审批」计数 */
}

/* ---- 驳回（第 6 步）---- */
function rejectApp(){
  const o = getDRec();
  if (!o || o.state !== '待审批') return;
  readAppForm();
  const f = dState.form;
  if (!f.reason) return;          /* 没选原因就不给驳回，按钮本来就是禁用的，这里双保险 */
  o.state  = '已驳回';
  o.reason = f.reason;
  o.advice = f.advice || '';
  o.note   = f.note   || '';
  dState.mode = 'view';
  renderAppDrawer(o);
  refreshView();
  renderNav();
}

/* ---------- 路由 ---------- */
const R = {overview:vOverview, teachers:vTeachers, students:vStudents, board:vBoard, lessons:vLessons, apply:vApply, data:vData, settle:vSettle, members:vMembers};

function renderNav(){

    if (v.id==='lessons')  cnt = monthCounted(monthOf(DB.todayDate)).length;

function route(){ return (location.hash||'#overview').slice(1); }

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  /* ---- 抽屉优先：抽屉内的按钮绝不能被下面的全局分支截获 ---- */
  if (e.target.closest('#dScrim')){ closeDrawer(); return; }
  if (e.target.closest('#drawer [data-d-close]')){ closeDrawer(); return; }
  if (e.target.closest('#drawer [data-d-edit]')){ startEdit(); return; }
  if (e.target.closest('#drawer [data-d-save]')){ saveEdit(); return; }
  if (e.target.closest('#drawer [data-d-cancel]')){ cancelEdit(); return; }
  const dp = e.target.closest('#drawer [data-d-pick]');
  if (dp){ togglePick(dp); return; }
  /* ---- 开班申请抽屉 ---- */
  if (e.target.closest('#drawer [data-a-rej]')){
    readAppForm(); dState.mode = 'reject'; renderAppDrawer(getDRec()); return;
  }
  if (e.target.closest('#drawer [data-a-cancel]')){
    readAppForm(); dState.mode = 'view'; renderAppDrawer(getDRec()); return;
  }
  const ad = e.target.closest('#drawer [data-a-do]');
  if (ad){
    const k = ad.dataset.aDo;
    if (k === 'approve')      approveApp();
    else if (k === 'create')  createApp();     /* 新建开班申请（操作员自己排的班） */
    else                      rejectApp();
    return;
  }
  /* ---- 整行可点开档案 ----
     preventDefault 是保险丝：行内若出现 <a href="#">，不拦会把 hash 变成 '#'，
     route() 返回 '' → 回落到 vOverview()，页面会莫名跳回总览 */
  const row = e.target.closest('[data-open]');
  if (row){ e.preventDefault(); openDrawer(row.dataset.open); return; }
  /* 排课页头的两个动作：＋ 开班（新建一条操作员申请）/ 自动编班（候选池 → 已有班）
     ＋ 开班 那个抽屉里还有「加 / 删学生行」两个动作 */
  const act = e.target.closest('[data-act]');
  if (act){
    const k = act.dataset.act;
    if (k === 'new')       openNewApp();
    else if (k === 'auto') autoAssign();
    else if (k === 'newteacher') openNewTeacher();
    else if (k === 'newstudent') openNewStudent();
    else if (k === 'goclasses'){
      /* 总览「差 N 人开班」那条：班级没有自己的抽屉，就跳到排课 › 班级 子页签去看它 */
      if (bTab !== 'classes') bTab = 'classes';
      if (location.hash === '#board') render(); else location.hash = '#board';
    }
    else if ((k === 'addstu' || k === 'delstu') && dState && dState.isNew){
      readAppForm();                                   /* 先把已填的名单收回来，否则重画会丢 */
      const i = Number(act.dataset.i) || 0;
      if (k === 'addstu') dState.form.roster.push({ name:'', phone:'' });
      else                dState.form.roster.splice(i, 1);
      if (!dState.form.roster.length) dState.form.roster.push({ name:'', phone:'' });
      renderNewAppDrawer();
    }
    return;
  }
  /* 只有侧栏的导航项用 data-v 跳转；
     过滤器的 .seg 按钮也带 data-v，绝不能一起吞掉，所以限定在 #nav 内 */
  const t = e.target.closest('#nav [data-v]');
  if (t){
    /* hash 没变时 hashchange 不会触发（比如重复点当前这一项），得手动 render() */
    const h = '#' + t.dataset.v;
    if (location.hash === h) render(); else location.hash = h;
    return;
  }
  /* 课次记录页的月份条：选中月份存在 mSel 里（查询参数，不落库） */
  const mb = e.target.closest('#mbar button[data-m]');
  if (mb){ mSel = mb.dataset.m; render(); return; }
  const bt = e.target.closest('#btabs button');
  if (bt){ bTab = bt.dataset.t; render(); return; }
  const dt = e.target.closest('#dtabs button');
  if (dt){ dTab = dt.dataset.t; render(); return; }
  const sg = e.target.closest('.seg button');
  if (sg){
    const f = sg.parentElement.dataset.f;
    if (f==='src') fTeacher.src = sg.dataset.v;
    if (f==='own') fStu.own = sg.dataset.v;
    if (f==='where') fStu.where = sg.dataset.v;
    /* 开班申请列表：切状态时把「驳回原因」筛回全部，否则会看到空列表 */
    if (f==='app'){ fApp.st = sg.dataset.v; fApp.reason = 'all'; }
    if (f==='appReason') fApp.reason = sg.dataset.v;
    render(); return;
  }
});

     驳回态选了原因 → 「确认驳回」按钮的禁用状态要跟着变 */
  const a = e.target.closest('#drawer [data-a-inp]');
  if (a && dState && dState.kind === 'app'){
    const f = a.dataset.aInp;
    if (dState.isNew){
      /* 新建态：切「线上 / 线下」要重画（教室字段跟着出现或消失） */
      if (f === 'mode'){ readAppForm(); renderNewAppDrawer(); }
    } else if ((dState.mode !== 'reject' && f === 'room') || (dState.mode === 'reject' && f === 'reason')){
      readAppForm();
      renderAppDrawer(getDRec());
    }
  }
});
$('#burger').addEventListener('click', ()=>{ $('#side').classList.toggle('open'); $('#scrim').classList.toggle('on'); });
$('#scrim').addEventListener('click', ()=>{ $('#side').classList.remove('open'); $('#scrim').classList.remove('on'); });
/* 顶栏搜索：一个框管三处（教师 / 学生 / 排课 › 班级），跟 placeholder 的承诺对齐。
   在排课页搜索时自动切到「班级」子页签 —— 否则用户搜班名却盯着矩阵，会以为框坏了 */
function onSearch(v){
  fQ = v;
  const r = route();
  if (r === 'board' && fQ && bTab !== 'classes') bTab = 'classes';
  if (r === 'teachers' || r === 'students' || r === 'board') render();
}
$('#q').addEventListener('input', e => onSearch(e.target.value));
document.addEventListener('keydown', e => { if (e.key==='Escape' && dState) closeDrawer(); });
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>

function renderDrawer(){
  if (!dState) return;
  /* 备份链路的两态：它们不是档案，没有对应记录 ——
     ⚠️ 必须在 getDRec() 之前拦掉，否则 getDRec() 返回 null，下面会直接 closeDrawer() */
  if (dState.kind === 'export'){ renderExportDrawer(); return; }
  if (dState.kind === 'import'){ renderImportDrawer(); return; }
  /* 点名 / 编入（2026-10-12 第 ③ 步）：都不是档案 —— 一个挂在「班级」上，一个挂在「学生」上 */
  if (dState.kind === 'roll'){ renderRollDrawer(); return; }
  if (dState.kind === 'enroll'){ renderEnrollDrawer(); return; }
  /* 数据三页的明细抽屉（2026-10-12）：都不是档案 —— att 挂学生出勤，exam 挂学生考试 */
  if (dState.kind === 'att'){ renderAttDrawer(); return; }
  if (dState.kind === 'exam'){ renderExamDrawer(); return; }
  /* 新建态没有对应记录，先拦掉（否则下面 getDRec 拿不到会 closeDrawer） */
  if (dState.isNew){
    if (dState.kind === 'app') renderNewAppDrawer();
    else                       renderNewProfileDrawer();
    return;
  }
  const o = getDRec();
  if (!o){ closeDrawer(); return; }
  if (dState.kind === 'app'){ renderAppDrawer(o); return; }
  const isT = dState.kind === 'teacher';
  const isM = dState.kind === 'member';
  const edit = dState.edit;
  const m = edit ? dState.draft : o;
  let body;
  if (isM)      body = edit ? mEdit(m) : mView(o);
  else if (isT) body = edit ? tEdit(m) : tView(o);
  else          body = edit ? sEdit(m) : sView(o);
  $('#drawer').innerHTML =
    '<div class="d-h">'+
      '<div><div class="t">'+esc(o.name)+'</div>'+
      '<div class="s">'+(isT ? '教师' : isM ? '成员' : '学生')+' · '+esc(String(o.id).toUpperCase())+'</div></div>'+
      '<button class="x" data-d-close title="关闭" aria-label="关闭">✕</button>'+
    '</div>'+
    '<div class="d-b">'+body+'</div>'+
    '<div class="d-f">'+
      (edit
        ? '<button class="btn pri" data-d-save>保存</button><button class="btn" data-d-cancel>取消</button>'
        : '<button class="btn pri" data-d-edit>编辑</button>')+
      '<div class="sp"></div>'+
      '<span class="d-memo">改动会存进本机浏览器<br>关掉再开还在</span>'+
    '</div>';
}

/* ==========================================================================
   开班申请 · 审批闭环（7 步）
   第 1 步 校验主体是「操作员」—— 只看时间 / 课室碰撞 + 内容有没有问题。
           人数门槛（8–12）只作参考显示，不拦通过。
   第 2 步 找已有班：级别 + 时段 + 形态 相同、阶段相同、并入后不超容量 → 归入该班
   第 3 步 没命中 → 建班表单（预填可改），预填值随来源走（自家 / 外包不一样）
   第 4 步 已成立的班只审时间，其余字段不反复审
   第 5 步 确认后一次性：置「已通过」+ 登记教师可授时段 + 建班／归入已有班
   第 6 步 驳回必须填原因（时间碰撞 / 线下课室被占）+ 反建议时段
   第 7 步 列表筛选条：全部 / 待审批 / 已通过 / 已驳回 + 按具体驳回原因
   ========================================================================== */

/* 演示用水果班名 / 代号 —— 跟 c1–c5 同一套命名，新开班顺着往下取 */
const FRUIT = [['苹果','AP'],['凤梨','DN'],['芒果','MG'],['荔枝','LZ'],['龙眼','LY'],
               ['榴莲','LL'],['山竹','SZ'],['红毛丹','HMD'],['椰子','YZ'],['火龙果','HLG']];

/* 申请来源 → 归属：own=自家外境 → 自有；out=外包外境 → 外包；
   edit=操作员自己编辑的排班 → 按这位教师的档案 */
function appOwn(a){
  if (a.src === 'own') return 'own';
  if (a.src === 'out') return 'out';
  return T(a.teacher).src || 'own';
}
/* 进度文案：第一阶段 · 第 3 课（阶段由课次反查，跟 STAGE() 同一套分档） */
const progOf   = n => n > 0 ? stageName(n) + ' · 第 ' + n + ' 课' : '尚未开课';
const progText = a => progOf(a.lesson);

/* 建班表单里改了教室 → 碰撞检查要用新教室重算，不能还用申请里的旧教室 */
function roomOf(o){
  return (dState && dState.form && dState.form.room != null) ? dState.form.room : (o.room || '');
}

/* ---- 系统查碰撞（第 4 步）----
   返回 null = 没碰撞；否则 {kind:'clash'|'room', hit, what} */
function clashOf(a){
  /* ① 教师时间碰撞：同一位教师在同一时段已经有班 */
  const tc = DB.classes.find(c => c.slot === a.slot && c.teacher === a.teacher);
  if (tc) return {kind:'clash', hit:tc, what:'class'};
  /* ② 已经有通过的申请占了同一位教师的同一时段 */
  const ta = DB.apps.find(x => x !== a && x.state === '已通过' && x.slot === a.slot && x.teacher === a.teacher);
  if (ta) return {kind:'clash', hit:null, what:'app', app:ta};
  /* ③ 线下教室碰撞：线上课不占教室，只有线下才查（课室总数待 Tony 提供） */
  const room = roomOf(a);
  if (a.mode === 'offline' && room){
    const rc = DB.classes.find(c => c.mode === 'offline' && c.slot === a.slot && c.room && c.room === room);
    if (rc) return {kind:'room', hit:rc, what:'class'};
  }
  return null;
}

/* ---- 找已有班（第 2 步）----
   并的是「课」不是「人」：这个时段本来就有一门同样的课，新学生放进它的空位 */
function findMatch(a){
  return DB.classes.find(c =>
    c.lv === a.lv && c.slot === a.slot && c.mode === a.mode &&
    stageOf(classLesson(c)) === stageOf(a.lesson) &&
    classN(c) + a.n <= c.cap
  ) || null;
}

/* ---- 建班 / 驳回的表单草稿 ---- */
function appFormOf(o){
  const used = DB.classes.map(c => c.name);
  const f = FRUIT.find(x => used.indexOf(x[0] + '班') < 0) || ['新班','NW'];
  const n = DB.classes.length + 1;
  const cl = clashOf(o);
  return {
    /* 第 3 步：预填跟来源走 —— 自家教师 / 外包教师默认值不一样 */
    name: f[0] + '班',
    code: f[1] + '-' + String(n).padStart(2,'0'),
    cap: DB.set.capMax,
    room: o.room || '',
    own: appOwn(o),
    /* 第 6 步：驳回原因。系统查到碰撞就预填那一项，没查到就必须自己选（驳回要给理由） */
    reason: cl ? cl.kind : '',
    advice: '',
    note: '',
  };
}
/* 把抽屉里 data-a-inp 的值读回草稿（用户可能改过预填值） */
function readAppForm(){
  if (!dState || !dState.form) return;
  $('#drawer').querySelectorAll('[data-a-inp]').forEach(el => {
    dState.form[el.dataset.aInp] = el.value;
  });
  /* 学生名单是一组同名字段（data-a-roster + data-i），按行号收回来。
     ⚠ 不能塞进上面的 data-a-inp 里 —— 那会在每次输入 change 时触发重画，焦点会丢 */
  if (dState.form.roster){
    const rows = {};
    $('#drawer').querySelectorAll('[data-a-roster]').forEach(el => {
      const i = Number(el.dataset.i) || 0;
      const r = rows[i] || (rows[i] = { name:'', phone:'' });
      r[el.dataset.aRoster] = el.value;
    });
    const keys = Object.keys(rows).map(Number).sort((a, b) => a - b);
    if (keys.length) dState.form.roster = keys.map(k => rows[k]);
  }
}

function aCheck(o){
  const cl = clashOf(o);
  if (cl && cl.kind === 'clash'){
    return '<div class="a-clash"><b>⛔ 时间碰撞 · 不能通过</b><br>'+
      esc(T(o.teacher).name)+' 在 <b>'+esc(S(o.slot).name)+' '+esc(S(o.slot).time)+'</b> 已经有课'+
      (cl.hit ? '（'+esc(cl.hit.name)+' '+esc(cl.hit.code)+'）' : '（另一条已通过的申请）')+
      '。请驳回，并给对方一个空档时段的建议。</div>';
  }
  if (cl && cl.kind === 'room'){
    return '<div class="a-clash"><b>⛔ 线下课室已被占用 · 不能通过</b><br>'+
      '教室 <b>'+esc(roomOf(o))+'</b> 在 <b>'+esc(S(o.slot).name)+' '+esc(S(o.slot).time)+'</b> 已经被 '+
      (cl.hit ? esc(cl.hit.name)+' '+esc(cl.hit.code) : '其他班')+' 占用。'+
      '<span class="lbl">（线上课不占教室；课室总数待补）</span></div>';
  }
  let s = '<div class="a-ok"><b>✓ 系统检查通过</b> —— 教师时间没有碰撞'+
    (o.mode==='offline'
      ? '，教室 <b>'+esc(roomOf(o)||'—')+'</b> 在这个时段也空着。'
      : '（线上课不占教室）。')+'</div>';
  if (o.n < DB.set.minOpen)
    s += '<div class="a-warn"><b>人数参考</b> —— 现在 '+o.n+' 人，低于开班门槛 '+DB.set.minOpen+
         ' 人。<span class="lbl">（只提示，不拦通过）</span></div>';
  if (o.n > DB.set.capMax)
    s += '<div class="a-warn"><b>人数参考</b> —— 现在 '+o.n+' 人，超过单班上限 '+DB.set.capMax+
         ' 人。<span class="lbl">（只提示，不拦通过）</span></div>';
  return s;
}

function createApp(){
  readAppForm();
  const f = dState.form;
  const room = String(f.room||'').trim();
  if (!f.teacher || !f.lv || !f.slot || !f.mode) return;
  if (f.mode === 'offline' && !room) return;      /* 线下不填教室，碰撞就没法判 */
  const nums = DB.apps.map(a => parseInt(String(a.id).replace(/\D/g,''), 10) || 0);
  const id = 'a' + (Math.max(0, ...nums) + 1);
  /* 学生名单：只收填了姓名的行 */
  const roster = (f.roster || [])
    .map(s => ({ name: String(s.name||'').trim(), phone: String(s.phone||'').trim() }))
    .filter(s => s.name);
  DB.apps.unshift({
    id: id, src: 'edit', teacher: f.teacher, lv: f.lv,
    stage: stageOf(1), lesson: 1,
    mode: f.mode, slot: f.slot,
    room: f.mode === 'offline' ? room : '',
    n: Math.max(0, parseInt(f.n, 10) || 0),
    roster: roster,
    at: stamp(), state: '待审批',
  });
  save();
  closeDrawer();
  /* hash 没变时 hashchange 不触发，得手动 render() */
  if (location.hash === '#apply') render(); else location.hash = '#apply';
}

/* 把申请里的学生名单落成学生档案 + 编入这个班。
   这样「每位学生跟哪位教师」在档案里就有据可查（归属教师 = 班的教师）。
   ⚠ 2026-10-12 起班人数由 classN() 从学生表现算 —— 这里只挂 s.cls，不用管计数。
      （以前调用方还要 mt.n += addN，现在整条链路都删了。） */
function addStudentsFromRoster(o, classId){
  const roster = (o.roster || []).filter(r => r && String(r.name||'').trim());
  if (!roster.length) return 0;
  const nums = DB.students.map(s => parseInt(String(s.id).replace(/\D/g,''), 10) || 0);
  let seq = Math.max(0, ...nums);
  roster.forEach(r => {
    seq++;
    DB.students.push({
      id: 'st' + seq,
      name: String(r.name).trim(),
      lv: o.lv, own: 'own', cls: classId,
      /* 今天才编进来的 → 入班日 = 今天。所以他的"应出勤"从 0 开始，
         不能拿这个班以前上过的课来算他的出勤 */
      joinedAt: DB.todayDate, intent: '', contact: '本人',
      exam: {}, phone: String(r.phone||'').trim(),
      job: '', grade: '', goal: 'both', source: 'teacher', slots: [o.slot],
    });
  });
  return roster.length;
}

/* ================= 自动编班（候选池 → 已有班） =================
   已定规则：只有「意向班级 + 级别 + 可上课时段」都对得上才编；对不上不编，并标原因。 */
let autoResult = null;
function autoAssign(){
  const pool = DB.students.filter(s => !s.cls && s.intent);
  const done = [], skip = [];
  pool.forEach(s => {
    const c = DB.classes.find(x => x.code === s.intent);
    if (!c)                                   { skip.push(s.name+'（找不到 '+s.intent+'）'); return; }
    if (c.lv !== s.lv)                        { skip.push(s.name+'（级别不符）'); return; }
    if (classN(c) >= c.cap)                   { skip.push(s.name+'（'+c.name+' 已满 '+classN(c)+'/'+c.cap+'）'); return; }
    if ((s.slots||[]).length && s.slots.indexOf(c.slot) < 0)
                                              { skip.push(s.name+'（时段对不上）'); return; }
    /* ⚠️ 只把学生挂到班上就够了 —— 人数由 classN() 从学生表现算，不要再 ++ */
    s.cls = c.id;
    done.push(s.name+' → '+c.name);
  });
  autoResult = { done: done, skip: skip, at: stamp() };
  save();
  render();
}
function autoBanner(){
  if (!autoResult) return '';
  const d = autoResult.done, s = autoResult.skip;
  return '<div class="note'+(d.length ? '' : ' amber')+'" style="margin:0 0 14px">'+
    '<b>自动编班结果</b>（'+esc(autoResult.at)+'）：编入 '+d.length+' 人'+
    (d.length ? ' —— '+d.map(esc).join('、') : '')+
    (s.length ? '<br>跳过 '+s.length+' 人：'+s.map(esc).join('、') : '')+
    '</div>';
}

/* ================= 排课 › 班级 的三个行内动作（2026-10-12 第 ③ 步）=================
   Tony 当天拍板的两条：
     ① 推进一课 —— **只推这一个班**，不跟着推别的班（老系统有 sync 开关，这里不要）
     ② 删班 —— 课次记录标 cancel **留着**（「账不能撕，只能冲销」），学员退回候选池 */

/* 推进一课：把该班「下一节该上的课」标成 done。
   优先「今天」那节，其次最早的「已排未上」。
   ⚠️ 上掉的课不能记在未来 —— 课表是预排的，plan 的日期可能 > 今天，推进时要压回今天。 */
function advanceClass(cid){
  if (!cid) return false;
  const c = C(cid);
  if (!DB.classes.some(x => x.id === cid)){ toast('这个班已经不在了'); return false; }
  const total = c.plannedLessons || 42;
  if (classLesson(c) >= total){ toast(c.name + ' 已完成全部 ' + total + ' 课次'); return false; }
  const ls = lessonsOf(cid);
  const next = ls.find(l => l.status === 'today')
            || ls.filter(l => l.status === 'plan')
                 .sort((a, b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0))[0];
  if (!next){ toast(c.name + ' 还没有课表 —— 先确认它有开班日和时段'); return false; }
  next.status = 'done';
  if (next.date > DB.todayDate) next.date = DB.todayDate;   /* 上掉的课不记在未来 */
  buildFacts();          /* 派生层「今日课程」跟着重算 */
  save();
  toast('已推进：' + c.name + ' 第 ' + next.no + ' 课');
  render();
  return true;
}

/* 删班（Tony 定：课次标 cancel 留着）——
   ① 学员退回候选池 ② 该班课次全标 cancel（记录留着，只是不算数）③ 班从 classes 里去掉。
   ⚠️ 班一删，C(cid) 就查不到了；课次记录页靠 lessons 里的「班信息快照」(cname 等) 显示原班名。 */
function delClass(cid){
  if (!cid) return false;
  const c = C(cid);
  if (!DB.classes.some(x => x.id === cid)){ toast('这个班已经不在了'); return false; }
  const n = DB.students.filter(s => s.cls === cid).length;
  const msg = '删除「' + c.name + '」？' +
    (n ? '\n\n' + n + ' 名学员会退回候选池。' : '\n') +
    '\n它的课次记录会保留，但标成「已取消」（账不撕，只冲销）。';
  if (typeof window.confirm === 'function' && !window.confirm(msg)) return false;
  DB.students.forEach(s => { if (s.cls === cid) s.cls = null; });
  DB.lessons.forEach(l => { if (l.cid === cid) l.status = 'cancel'; });
  DB.classes = DB.classes.filter(x => x.id !== cid);
  buildFacts();
  save();
  toast('已删除 ' + c.name + (n ? '，' + n + ' 名学员退回候选池' : ''));
  render();
  return true;
}

/* ---- 点名抽屉 ----
   只记「缺勤」（默认全勤）—— 与 absences 表的设计一致：一个班 20 人 × 40 节 = 800 条记录，
   但缺勤可能只有 20 条，反过来存省 97%，而且「谁没来」才是管理要看的。
   ⚠️ 缺勤要挂在某一节课上（a.no = 该班第几课），所以「没有已上课次」的班点不了名。 */
function openRollDrawer(cid){
  if (!cid) return;
  const c = C(cid);
  if (!DB.classes.some(x => x.id === cid)){ toast('这个班已经不在了'); return; }
  const ls = lessonsOf(cid);
  const rollable = ls.filter(l => l.status === 'done' || l.status === 'today');
  if (!rollable.length){
    toast(c.name + ' 还没有「已上」的课次 —— 先点一次「推进一课」');
    return;
  }
  dState = { kind:'roll', cid:cid, no:rollable[rollable.length - 1].no };
  renderDrawer();
  openPanel();
}

function renderRollDrawer(){
  const cid = dState.cid;
  const c = C(cid);
  const ls = lessonsOf(cid);
  const rollable = ls.filter(l => l.status === 'done' || l.status === 'today');
  const students = DB.students.filter(s => s.cls === cid);

  if (!rollable.length){

    return;
  }
  if (!rollable.some(l => l.no === dState.no)) dState.no = rollable[rollable.length - 1].no;

  /* 每次重画都从事实表重读缺勤名单 —— 别信 dState 里的旧值 */

    '</div>'+

/* 保存点名：先删该班该节的全部缺勤，再按勾选重建 —— 幂等，重复保存结果一致 */
function saveRoll(){
  if (!dState || dState.kind !== 'roll') return false;
  const cid = dState.cid, no = dState.no;
  if (!cid || !no) return false;
  const picked = [];
  $('#drawer').querySelectorAll('[data-r-sid]').forEach(el => {
    if (el.checked) picked.push(el.dataset.rSid);
  });
  DB.absences = DB.absences.filter(a => !(a.cid === cid && a.no === no));
  picked.forEach(sid => DB.absences.push({ sid:sid, cid:cid, no:no }));
  buildFacts();
  save();
  closeDrawer();
  toast('已记 ' + picked.length + ' 人缺勤');
  render();
  return true;
}

/* ---- 编入班级抽屉（候选池 → 已有班，2026-10-12 第 ③ 步）----

   能编的给按钮，不能编的**标出原因**（透明 —— 别让人猜为什么这个班点不了）。 */
function openEnrollDrawer(sid){

/* 为什么这个班编不进去 —— 返回 '' 表示能编 */
function enrollWhy(s, c){
  if (c.lv !== s.lv) return '级别不符（这个班是 ' + c.lv + '）';
  if (classN(c) >= c.cap)  return '已满（' + classN(c) + '/' + c.cap + '）';
  const ids = (s.slots || []).filter(x => DB.slots.some(v => v.id === x));
  if (ids.length && ids.indexOf(c.slot) < 0) return '时段对不上';
  return '';
}

function renderEnrollDrawer(){
  const s = DB.students.find(x => x.id === dState.sid);
  if (!s){ closeDrawer(); return; }
  const rows = DB.classes.length ? DB.classes.map(c => {
    const w = enrollWhy(s, c);
    return '<div class="enrrow'+(w ? ' no' : '')+'">'+

      '<div class="e3">'+(w ? '<span class="tg bad">'+w+'</span>'

    '</div>';
  }).join('') : '<div class="empty">还没有任何班级 —— 先去「开班申请」批一个</div>';

  $('#drawer').innerHTML =
    '<div class="d-h">'+
      '<div><div class="t">'+esc(s.name)+'</div>'+
      '<div class="s">编入班级 · '+esc(s.lv)+' · '+esc(s.contact || '')+'</div></div>'+

      '<div class="note">该生可上课时段：'+slotCells(s)+'　级别：<span class="tg off">'+esc(s.lv)+'</span><br>'+
        '只有<b>级别相同 · 未满 · 时段对得上</b>的班能编入，其余会标出原因。</div>'+

/* ---- 出勤明细抽屉（只读，2026-10-12 数据页）----
   出勤页那一行只给汇总数，缺哪几节得能点开看 —— 否则「缺 2 次」只是个数字，追不下去。
   口径跟 stuAttAll 完全一致：只列「已上」的课次，而且从入班那天算起。 */
function openAttDrawer(sid){

    '</div>'+

/* 真正编入。★ joinedAt 必须写 —— 中途插班的出勤要从入班那天算起；
   不写的话 stuJoinedAt() 会回落到「开班日」，把这名学生入班前的课全算成缺勤。 */
function enrollInto(cid){
  if (!dState || dState.kind !== 'enroll') return false;
  const s = DB.students.find(x => x.id === dState.sid);
  const c = DB.classes.find(x => x.id === cid);
  if (!s || !c) return false;
  if (s.cls){ toast(s.name + ' 已经在班上了'); return false; }
  if (classN(c) >= c.cap){ toast(c.name + ' 已经满了'); return false; }
  s.cls = c.id;
  s.joinedAt = DB.todayDate;
  if (!s.teacherId) s.teacherId = c.teacher;
  /* ⚠️ 不再 c.n++ —— 人数由 classN() 从学生表现算 */
  buildFacts();
  save();
  closeDrawer();
  toast(s.name + ' 已编入 ' + c.name);
  render();
  return true;
}

function renderAppDrawer(o){
  const t = T(o.teacher);
  const closed = o.state !== '待审批';
  const rej = dState.mode === 'reject';
  let body = '', cl = null, mt = null;

  if (closed){
    body = aSec('申请内容', aFacts(o)) + aResult(o);
  } else if (rej){
    body = aSec('申请内容', aFacts(o)) + aRejectForm(o);
  } else {
    cl = clashOf(o);
    mt = cl ? null : findMatch(o);
    body = aSec('申请内容', aFacts(o)) + aSec('系统检查', aCheck(o));
    if (!cl) body += mt ? aMerge(o, mt) : aNewForm(o);
  }

  let foot;
  if (closed){
    foot = '<button class="btn" data-d-close>关闭</button>';
  } else if (rej){
    foot = '<button class="btn pri" data-a-do="reject"'+(dState.form.reason ? '' : ' disabled')+
           '>确认驳回</button>'+
           '<button class="btn" data-a-cancel>返回</button>';
  } else if (cl){
    foot = '<button class="btn" disabled>有碰撞 · 不能通过</button>'+
           '<button class="btn pri" data-a-rej>驳回并给建议</button>';
  } else {
    foot = '<button class="btn pri" data-a-do="approve">'+
             (mt ? '并入 '+esc(mt.name)+' · 批准' : '按以上建班 · 批准')+'</button>'+
           '<button class="btn" data-a-rej>驳回</button>';
  }

  $('#drawer').innerHTML =
    '<div class="d-h">'+
      '<div><div class="t">'+esc(t.name)+'</div>'+
      '<div class="s">开班申请 · '+esc(String(o.id).toUpperCase())+' · '+esc(srcText2(o.src))+'</div></div>'+
      '<button class="x" data-d-close title="关闭" aria-label="关闭">✕</button>'+
    '</div>'+
    '<div class="d-b">'+body+'</div>'+
    '<div class="d-f">'+foot+'<div class="sp"></div>'+
      '<span class="d-memo">本机存储 · 改动会存进本机浏览器<br>关掉再开还在</span></div>';
}

/* ---- 通过（第 5 步：一次性完成三件事）---- */
function approveApp(){
  const o = getDRec();
  if (!o || o.state !== '待审批') return;
  if (clashOf(o)) return;          /* 有碰撞，按钮本来就是禁用的，这里双保险 */
  readAppForm();
  const f = dState.form;
  const mt = findMatch(o);
  const t = T(o.teacher);
  /* ⚠️ 2026-10-12：这里以前会算 addN（名单人数，没名单就退回申请人数）然后 mt.n += addN。
     现在班人数一律由 classN() 从学生表 + 未登记名单的已通过申请现算，
     所以「有名单的」靠 addStudentsFromRoster 建档案自动计入、
     「没名单的」靠 classReserved() 按 o.n 计入 —— 这里一行都不用写。 */
  if (mt){
    o.link = mt.id; o.linkMode = 'merge';
  } else {
    const nc = {
      id: 'c' + (DB.classes.length + 1) + '-' + Date.now().toString(36),
      code: f.code || ('NW-' + String(DB.classes.length+1).padStart(2,'0')),
      name: f.name || '新班',
      lv: o.lv, mode: o.mode, slot: o.slot,
      teacher: o.teacher,
      /* ⚠️ 仍然不写死 lesson —— 进度一律从事实表数出来。
         申请里的「第 3 课」说的是"这批学生目前学到第 3 课"，不等于"这个班已经上过 3 节"。 */
      startedAt: DB.todayDate, endedAt: null, plannedLessons: 42,
      cap: Number(f.cap) || DB.set.capMax,
      /* ⚠️ 不写 n —— 人数从学生表现算（新班建出来时 0 人，
         名单里的学生由下面 addStudentsFromRoster 落成档案后自动计入） */
      room: o.mode === 'offline' ? (f.room || '') : '',
      own: f.own,
    };
    DB.classes.push(nc);
    /* ★ 2026-10-12 第 ③ 步：给新班生课表。
       以前这里不生 —— 新班在 lessons 事实表里一条记录都没有，后果是：
       ① 进度永远 0 ② 点名无处可挂（缺勤要挂在某节课上）③ 日历 / 课次记录页看不到它。
       班今天才开，所以生成的课次全是 today / plan —— 进度照样从 0 起算（这条没变）。 */
    seedLessonsOf(nc).forEach(l => DB.lessons.push(l));
    DB.lessons.sort((a, b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
    o.link = nc.id; o.linkMode = 'new';
  }
  o.state = '已通过';
  /* ② 把申请里的时段登记成这位教师的可授时段 */
  if (Array.isArray(t.slots) && t.slots.indexOf(o.slot) < 0) t.slots.push(o.slot);
  /* ③ 名单里的学生 → 学生档案 + 编入这个班（人数已在 addN 里算过，这里不再加） */
  addStudentsFromRoster(o, o.link);
  save();

  renderAppDrawer(o);
  refreshView();     /* 列表 + 筛选计数 */
  renderNav();       /* 侧栏「待审批」计数 */
}

/* ---- 驳回（第 6 步）---- */
function rejectApp(){
  const o = getDRec();
  if (!o || o.state !== '待审批') return;
  readAppForm();
  const f = dState.form;
  if (!f.reason) return;          /* 没选原因就不给驳回，按钮本来就是禁用的，这里双保险 */
  o.state  = '已驳回';
  o.reason = f.reason;
  o.advice = f.advice || '';
  o.note   = f.note   || '';
  save();
  dState.mode = 'view';
  renderAppDrawer(o);
  refreshView();
  renderNav();
}

/* ---------- 路由 ---------- */

      '<span class="cnt">'+pend+'</span></a>';
}
function route(){ return (location.hash||'#overview').slice(1); }
function render(){
  const id = route();
  $('#view').innerHTML = (R[id]||vOverview)();
  renderNav();
  /* 兜底到总览：hash 写错（比如旧书签 #design）时视图渲染的是 vOverview，
     面包屑也得跟着说「总览」，不能还挂着别的名字 */
  const v = VIEWS.find(x=>x.id===id) || VIEWS[0];
  $('#crumb').innerHTML = '主端<span class="sep">/</span><b>'+v.name+'</b>';
  $('#side').classList.remove('open'); $('#scrim').classList.remove('on');
  closeDrawer();   /* 导航 / 筛选 / 搜索离开当前视图时，顺手把档案抽屉收起来 */
  window.scrollTo(0,0);
  bFocus = null;   /* 矩阵点卡片点亮的那个班只亮这一次 render，下次重画就恢复正常 */
}

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  /* ---- 抽屉优先：抽屉内的按钮绝不能被下面的全局分支截获 ---- */
  if (e.target.closest('#dScrim')){ closeDrawer(); return; }
  if (e.target.closest('#drawer [data-d-close]')){ closeDrawer(); return; }
  if (e.target.closest('#drawer [data-d-edit]')){ startEdit(); return; }
  if (e.target.closest('#drawer [data-d-save]')){ saveEdit(); return; }
  if (e.target.closest('#drawer [data-d-cancel]')){ cancelEdit(); return; }
  const dp = e.target.closest('#drawer [data-d-pick]');
  if (dp){ togglePick(dp); return; }
  /* ---- 备份链路：导入抽屉里的「确认导入」 ---- */
  if (e.target.closest('#drawer [data-i-do]')){ doImport(); return; }
  /* ---- 点名抽屉：保存（2026-10-12 第 ③ 步）---- */
  if (e.target.closest('#drawer [data-r-save]')){ saveRoll(); return; }
  /* ---- 开班申请抽屉 ---- */
  if (e.target.closest('#drawer [data-a-rej]')){
    readAppForm(); dState.mode = 'reject'; renderAppDrawer(getDRec()); return;
  }
  if (e.target.closest('#drawer [data-a-cancel]')){
    readAppForm(); dState.mode = 'view'; renderAppDrawer(getDRec()); return;
  }
  const ad = e.target.closest('#drawer [data-a-do]');
  if (ad){
    const k = ad.dataset.aDo;
    if (k === 'approve')      approveApp();
    else if (k === 'create')  createApp();     /* 新建开班申请（操作员自己排的班） */
    else                      rejectApp();
    return;
  }
  /* ---- 排课 › 班级 的三个行内动作（2026-10-12 第 ③ 步）----
     ⚠️ 必须排在 [data-open] 之前：这几个是 <a href="#">，不拦会把 hash 变成 '#'
     → route() 返回 '' → 回落到总览，页面会莫名跳走 */
  const ca = e.target.closest('[data-c-act]');
  if (ca){
    e.preventDefault();
    const k = ca.dataset.cAct, cid = ca.dataset.cid;
    if (k === 'advance')      advanceClass(cid);
    else if (k === 'roll')    openRollDrawer(cid);
    else if (k === 'del')     delClass(cid);
    /* ---- 排课 › 矩阵的班级卡片 → 跳到「班级」子页签并点亮那一行（2026-10-12 第 ③ 步收尾）----
       班级没有自己的抽屉，跟总览「差 N 人开班」那条 goclasses 是同一个思路，只是多了个聚焦。
       ⚠️ hash 没变时 hashchange 不触发，得手动 render()（跟侧栏导航同一处理） */
    else if (k === 'open'){
      bFocus = cid; bTab = 'classes';
      if (location.hash === '#board') render(); else location.hash = '#board';
    }
    return;
  }
  /* ---- 排课 › 候选池：打开「编入班级」抽屉（2026-10-12 第 ③ 步）---- */
  const eo = e.target.closest('[data-e-open]');
  if (eo){ e.preventDefault(); openEnrollDrawer(eo.dataset.eOpen); return; }
  const eg = e.target.closest('#drawer [data-e-go]');
  if (eg){ enrollInto(eg.dataset.eGo); return; }
  /* ---- 整行可点开档案 ----
     preventDefault 是保险丝：行内若出现 <a href="#">，不拦会把 hash 变成 '#'，
     route() 返回 '' → 回落到 vOverview()，页面会莫名跳回总览 */
  const row = e.target.closest('[data-open]');
  if (row){ e.preventDefault(); openDrawer(row.dataset.open); return; }
  /* 排课页头的两个动作：＋ 开班（新建一条操作员申请）/ 自动编班（候选池 → 已有班）
     ＋ 开班 那个抽屉里还有「加 / 删学生行」两个动作 */
  const act = e.target.closest('[data-act]');
  if (act){
    const k = act.dataset.act;
    if (k === 'new')       openNewApp();
    else if (k === 'auto') autoAssign();
    else if (k === 'newteacher') openNewTeacher();
    else if (k === 'newstudent') openNewStudent();
    else if (k === 'newmember')  openNewMember();
    else if (k === 'exportstatement') exportStatement();
    else if (k === 'sealmonth') sealSettle();
    else if (k === 'editmember'){ e.preventDefault(); openDrawer('member:'+act.dataset.i); }
    else if (k === 'delmember'){ e.preventDefault(); delMember(act.dataset.i); }
    /* 备份链路：教师页 / 学生页 / 数据页三处入口，走的是同一对函数 */
    else if (k === 'export') exportData();
    else if (k === 'import') openImportDrawer();
    else if (k === 'goclasses'){
      /* 总览「差 N 人开班」那条：班级没有自己的抽屉，就跳到排课 › 班级 子页签去看它 */
      if (bTab !== 'classes') bTab = 'classes';
      if (location.hash === '#board') render(); else location.hash = '#board';
    }
    else if ((k === 'addstu' || k === 'delstu') && dState && dState.isNew){
      readAppForm();                                   /* 先把已填的名单收回来，否则重画会丢 */
      const i = Number(act.dataset.i) || 0;
      if (k === 'addstu') dState.form.roster.push({ name:'', phone:'' });
      else                dState.form.roster.splice(i, 1);
      if (!dState.form.roster.length) dState.form.roster.push({ name:'', phone:'' });
      renderNewAppDrawer();
    }
    return;
  }
  /* 只有侧栏的导航项用 data-v 跳转；
     过滤器的 .seg 按钮也带 data-v，绝不能一起吞掉，所以限定在 #nav 内 */
  const t = e.target.closest('#nav [data-v]');
  if (t){
    /* hash 没变时 hashchange 不会触发（比如重复点当前这一项），得手动 render() */
    const h = '#' + t.dataset.v;
    if (location.hash === h) render(); else location.hash = h;
    return;
  }
  /* 课次记录页的月份条：选中月份存在 mSel 里（查询参数，不落库） */
  const mb = e.target.closest('#mbar button[data-m]');
  if (mb){ mSel = mb.dataset.m; render(); return; }
  const bt = e.target.closest('#btabs button');
  if (bt){ bTab = bt.dataset.t; render(); return; }
  const dt = e.target.closest('#dtabs button');
  if (dt){ dTab = dt.dataset.t; render(); return; }
  const sg = e.target.closest('.seg button');
  if (sg){
    const f = sg.parentElement.dataset.f;
    if (f==='src') fTeacher.src = sg.dataset.v;
    if (f==='own') fStu.own = sg.dataset.v;
    if (f==='where') fStu.where = sg.dataset.v;
    /* 开班申请列表：切状态时把「驳回原因」筛回全部，否则会看到空列表 */
    if (f==='app'){ fApp.st = sg.dataset.v; fApp.reason = 'all'; }
    if (f==='appReason') fApp.reason = sg.dataset.v;
    render(); return;
  }
});
document.addEventListener('change', e => {
  /* ---- 点名抽屉：切换「点哪一节」（2026-10-12 第 ③ 步）---- */
  const rn = e.target.closest('#drawer [data-r-no]');
  if (rn && dState && dState.kind === 'roll'){ dState.no = Number(rn.value) || 0; renderRollDrawer(); return; }
  const s = e.target.closest('select[data-f]');
  if (s){ if (s.dataset.f==='lv'){ fTeacher.lv = s.value; fStu.lv = s.value; } render(); return; }
  /* 开班申请抽屉里的下拉 / 输入：
     建班态改了教室 → 碰撞检查要重算
     驳回态选了原因 → 「确认驳回」按钮的禁用状态要跟着变 */
  const a = e.target.closest('#drawer [data-a-inp]');
  if (a && dState && dState.kind === 'app'){
    const f = a.dataset.aInp;
    if (dState.isNew){
      /* 新建态：切「线上 / 线下」要重画（教室字段跟着出现或消失） */
      if (f === 'mode'){ readAppForm(); renderNewAppDrawer(); }
    } else if ((dState.mode !== 'reject' && f === 'room') || (dState.mode === 'reject' && f === 'reason')){
      readAppForm();
      renderAppDrawer(getDRec());
    }
  }
});
$('#burger').addEventListener('click', ()=>{ $('#side').classList.toggle('open'); $('#scrim').classList.toggle('on'); });
$('#scrim').addEventListener('click', ()=>{ $('#side').classList.remove('open'); $('#scrim').classList.remove('on'); });
/* 重置为演示数据：抹掉本机存盘 → 回到 seedDB 那批数据。
   加一句确认 —— 存盘里可能有他刚录的东西，误点代价太大 */
$('#btnReset').addEventListener('click', () => {
  const ok = (typeof window.confirm === 'function')
    ? window.confirm('重置会把本机存的数据全部抹掉，回到最初的演示数据。确定继续吗？')
    : true;
  if (ok) resetDB();
});
/* 顶栏搜索：一个框管三处（教师 / 学生 / 排课 › 班级），跟 placeholder 的承诺对齐。
   在排课页搜索时自动切到「班级」子页签 —— 否则用户搜班名却盯着矩阵，会以为框坏了 */
function onSearch(v){
  fQ = v;
  const r = route();
  if (r === 'board' && fQ && bTab !== 'classes') bTab = 'classes';
  if (r === 'teachers' || r === 'students' || r === 'board') render();
}
$('#q').addEventListener('input', e => onSearch(e.target.value));
document.addEventListener('keydown', e => { if (e.key==='Escape' && dState) closeDrawer(); });
window.addEventListener('hashchange', render);
render();
</script>
